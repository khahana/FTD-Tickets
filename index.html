<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>F-Trucks Deutschland — AfterSales Ticket System</title>
<meta name="theme-color" content="#003478">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FTD Tickets">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="FTD AfterSales">
<meta name="description" content="F-Trucks Deutschland AfterSales Ticket System">
<script>
function generateIcon(size){const c=document.createElement('canvas');c.width=size;c.height=size;const x=c.getContext('2d');x.fillStyle='#003478';x.fillRect(0,0,size,size);x.fillStyle='#F26522';x.fillRect(0,size*0.78,size,size*0.22);x.fillStyle='#FFFFFF';x.font='bold '+Math.round(size*0.22)+'px Arial';x.textAlign='center';x.fillText('FTD',size/2,size*0.38);x.font=Math.round(size*0.11)+'px Arial';x.fillText('AfterSales',size/2,size*0.55);x.fillText('Tickets',size/2,size*0.70);return c.toDataURL('image/png')}
window.addEventListener('DOMContentLoaded',()=>{
  const manifest={name:'F-Trucks Deutschland AfterSales Ticket System',short_name:'FTD Tickets',start_url:location.href,display:'standalone',orientation:'portrait',background_color:'#003478',theme_color:'#003478',icons:[]};
  [72,96,128,144,152,192,384,512].forEach(s=>{manifest.icons.push({src:generateIcon(s),sizes:s+'x'+s,type:'image/png',purpose:'any maskable'})});
  const mLink=document.createElement('link');mLink.rel='manifest';mLink.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));document.head.appendChild(mLink);
  const ai=document.createElement('link');ai.rel='apple-touch-icon';ai.href=generateIcon(180);document.head.appendChild(ai);
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('installBtn');if(b)b.style.display='inline-flex';const li=document.getElementById('loginInstall');if(li)li.style.display='block'});
function installPWA(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;const b=document.getElementById('installBtn');if(b)b.style.display='none'})}}
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root,[data-theme="light"]{--ford-blue:#003478;--ford-orange:#F26522;--bg:#F0F2F5;--bg-card:#fff;--bg-input:#fff;--border:#E2E8F0;--text:#1A1A2E;--text-sec:#64748B;--text-mut:#94A3B8;--success:#10B981;--success-bg:#ECFDF5;--warning:#F59E0B;--warning-bg:#FEF3C7;--danger:#EF4444;--danger-bg:#FEF2F2;--info:#3B82F6;--info-bg:#EFF6FF;--radius:10px;--radius-sm:6px;--font:'Segoe UI',system-ui,-apple-system,sans-serif;--mono:'Consolas',monospace}
[data-theme="dark"]{--ford-blue:#4A90D9;--ford-orange:#F26522;--bg:#0F172A;--bg-card:#1E293B;--bg-input:#334155;--border:#334155;--text:#E2E8F0;--text-sec:#94A3B8;--text-mut:#64748B;--success:#34D399;--success-bg:#064E3B;--warning:#FBBF24;--warning-bg:#78350F;--danger:#F87171;--danger-bg:#7F1D1D;--info:#60A5FA;--info-bg:#1E3A5F}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:#003478;color:#fff;padding:0 16px;padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer}
.icon-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;position:relative}
.icon-btn:hover{background:rgba(255,255,255,0.1)}
.notif-badge{position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.notif-panel{position:fixed;top:52px;right:10px;width:320px;max-height:400px;overflow-y:auto;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,0.15);z-index:200;display:none}
.notif-panel.active{display:block}
.notif-panel-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}
.notif-item{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer}
.notif-item.unread{background:var(--info-bg)}
.notif-item:hover{background:var(--bg)}
.notif-time{font-size:10px;color:var(--text-mut);margin-top:3px}
.tab-nav{display:flex;gap:4px;padding:8px 16px;background:var(--bg-card);border-bottom:1px solid var(--border);overflow-x:auto;flex-wrap:nowrap}
.tab-btn{padding:6px 14px;border:none;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;background:transparent;color:var(--text-sec);font-family:var(--font)}
.tab-btn.active{background:var(--ford-blue);color:#fff}
.tab-btn:hover:not(.active){background:var(--bg)}
.badge{background:rgba(0,0,0,0.1);padding:1px 6px;border-radius:10px;font-size:10px;margin-left:4px}
.tab-btn.active .badge{background:rgba(255,255,255,0.2)}
.main{padding:16px;max-width:1200px;margin:0 auto;padding-bottom:80px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--bg-card);border-radius:var(--radius);padding:40px 36px;width:100%;max-width:500px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.login-logo{text-align:center;margin-bottom:20px}
.login-logo img{height:180px;margin-bottom:20px}
.login-logo h2{font-size:18px;color:var(--ford-blue)}
.login-logo p{font-size:12px;color:var(--text-sec)}
.form-group{margin-bottom:8px}
.form-group label{display:block;font-size:11px;font-weight:600;margin-bottom:3px;color:var(--text-sec)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:var(--font);background:var(--bg-input);color:var(--text)}
.form-group textarea{resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:8px 16px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all 0.15s}
.btn-primary{background:var(--ford-blue);color:#fff}
.btn-ford{background:var(--ford-orange);color:#fff}
.btn-secondary{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.stat-label{font-size:10px;color:var(--text-mut);text-transform:uppercase;font-weight:600;letter-spacing:0.5px}
.stat-value{font-size:24px;font-weight:700;margin-top:2px}
.alert-banner{padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:12px;font-size:12px;font-weight:600;border:1px solid var(--danger);background:var(--danger-bg);color:var(--danger)}
.ticket-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ticket-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all 0.15s;border-left:4px solid transparent}
.ticket-card.needs-action{border-left:4px solid var(--ford-orange);box-shadow:0 0 8px rgba(232,168,56,0.3);animation:pulse-glow 2s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 6px rgba(232,168,56,0.2)}50%{box-shadow:0 0 14px rgba(232,168,56,0.45)}}
.ticket-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.08);transform:translateY(-1px)}
.ticket-card.p-critical{border-left-color:var(--danger)}.ticket-card.p-high{border-left-color:var(--warning)}.ticket-card.p-medium{border-left-color:var(--info)}.ticket-card.p-low{border-left-color:var(--success)}
.ticket-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ticket-id{font-size:11px;font-weight:600;color:var(--text-mut);font-family:var(--mono)}
.ticket-date{font-size:11px;color:var(--text-mut)}
.ticket-title{font-size:14px;font-weight:600;margin-bottom:4px}
.ticket-desc{font-size:12px;color:var(--text-sec);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ticket-meta{display:flex;flex-wrap:wrap;gap:4px}
.tag{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;display:inline-block}
.tag-open{background:var(--info-bg);color:var(--info)}.tag-info{background:#EDE9FE;color:#7C3AED}.tag-progress{background:var(--warning-bg);color:var(--warning)}.tag-resolved{background:var(--success-bg);color:var(--success)}.tag-closed{background:var(--bg);color:var(--text-mut)}
.tag-critical{background:var(--danger-bg);color:var(--danger)}.tag-high{background:var(--warning-bg);color:var(--warning)}.tag-medium{background:var(--info-bg);color:var(--info)}.tag-low{background:var(--success-bg);color:var(--success)}
.tag-cat{background:#FFF3E0;color:#E65100}.tag-mob{background:var(--success-bg);color:var(--success)}.tag-immob{background:var(--danger-bg);color:var(--danger)}.tag-media{background:var(--bg);color:var(--text-sec)}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;background:var(--bg-input);color:var(--text);font-family:var(--font)}
.filter-search{flex:1;min-width:150px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;background:var(--bg-input);color:var(--text);font-family:var(--font)}
.detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:300;display:none}
.drill-panel{position:fixed;top:0;right:-420px;width:400px;max-width:90vw;height:100vh;background:var(--bg-card);z-index:302;transition:right 0.3s;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,0.15)}
.drill-panel.active{right:0}
.drill-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.drill-hdr h4{font-size:14px;color:var(--ford-blue)}
.drill-body{flex:1;overflow-y:auto;padding:12px}
.drill-item{padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;cursor:pointer;font-size:12px}
#partsDD.active{display:block!important}
#otherDD.active{display:block!important}
.drill-item:hover{background:var(--bg);border-color:var(--ford-blue)}
.drill-item.needs-action{border-left:4px solid var(--ford-orange);box-shadow:0 0 8px rgba(232,168,56,0.3);animation:pulse-glow 2s ease-in-out infinite}
.detail-overlay.active{display:flex;align-items:center;justify-content:center}
.detail-panel{position:relative;width:90%;max-width:900px;max-height:90vh;background:var(--bg-card);z-index:301;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,0.25);border-radius:var(--radius);overflow:hidden}
.detail-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.detail-hdr h3{font-size:16px}
.detail-body{flex:1;overflow-y:auto;padding:16px}
.detail-section{margin-bottom:16px}
.detail-section-title{font-size:12px;font-weight:700;color:var(--ford-orange);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.detail-field label{font-size:10px;color:var(--text-mut);display:block;margin-bottom:2px}
.detail-field span{font-size:13px;font-weight:500}
.detail-desc{font-size:13px;line-height:1.6;color:var(--text-sec);background:var(--bg);padding:10px;border-radius:var(--radius-sm)}
.detail-footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.activity-list{max-height:300px;overflow-y:auto}
.activity-item{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.activity-avatar{width:28px;height:28px;border-radius:50%;background:var(--ford-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.activity-content{flex:1;font-size:12px}
.activity-author{font-weight:600;margin-right:6px}
.activity-time{font-size:10px;color:var(--text-mut)}
.activity-text{margin-top:3px;color:var(--text-sec)}
.activity-change{margin-top:3px;color:var(--ford-blue);font-style:italic}
.comment-input{display:flex;gap:6px;margin-top:10px}
.comment-input input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;background:var(--bg-input);color:var(--text);font-family:var(--font)}
.close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-sec);padding:4px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:400;display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--bg-card);border-radius:var(--radius);width:95%;max-width:800px;max-height:92vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.2)}
.modal-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-hdr h3{font-size:15px}
.modal-body{padding:16px}
.modal-footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.file-drop{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;cursor:pointer;font-size:12px;color:var(--text-mut)}
.file-drop.dragover{border-color:var(--ford-orange);background:var(--bg)}
.file-previews{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.file-preview{width:60px;height:60px;border-radius:var(--radius-sm);overflow:hidden;position:relative;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--text-sec);cursor:pointer;background:var(--bg)}
.file-preview img{width:100%;height:100%;object-fit:cover}
.file-preview .rm{position:absolute;top:2px;right:2px;width:16px;height:16px;background:var(--danger);color:#fff;border:none;border-radius:50%;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.settings-table{width:100%;border-collapse:collapse;font-size:12px}
.settings-table th{text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;color:var(--ford-blue);border-bottom:2px solid var(--border)}
.settings-table td{padding:7px 10px;border-bottom:1px solid var(--border)}
.empty-state{text-align:center;padding:40px;color:var(--text-mut)}
.lightbox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:500;display:none;align-items:center;justify-content:center;cursor:pointer}
.lightbox.active{display:flex}
.lightbox img{max-width:90%;max-height:90%;border-radius:8px}

.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);z-index:90;padding:4px 0;padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav-inner{display:flex;justify-content:space-around}
.mnav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;background:none;border:none;font-size:9px;color:var(--text-mut);cursor:pointer;font-family:var(--font)}
.mnav-btn svg{width:20px;height:20px}
.mnav-btn.active{color:var(--ford-blue)}
.hint{font-size:10px;color:var(--text-mut);margin-top:2px}
@media(max-width:768px){
  .tab-nav{display:none}
  .mobile-nav{display:block}
  .detail-panel{width:100%;max-width:100%;max-height:100vh;border-radius:0}
  .form-row{grid-template-columns:1fr}
  .ticket-grid{grid-template-columns:1fr}
  .topbar-username{display:none}
  .login-logo img{height:100px !important}
  .analytics-sidebar{display:none !important}
  .analytics-content{min-width:0 !important}
  .analytics-flex{flex-direction:column !important}
  .analytics-grid-2{grid-template-columns:1fr !important}
  .mobile-dealer-filter{display:block !important}
  .stats-row{grid-template-columns:repeat(2,1fr) !important}
  .settings-table{font-size:10px}
  .settings-table th,.settings-table td{padding:5px 6px}
  .stat-card{padding:8px}
  .stat-value{font-size:20px}
  .stat-label{font-size:9px}
}
@media screen and (orientation:landscape) and (max-height:500px){
  body::after{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:var(--ford-blue);z-index:9999;display:flex;align-items:center;justify-content:center}
  body::before{content:'\uD83D\uDCF1 Bitte Hochformat verwenden / Please use portrait mode';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:18px;font-family:var(--font);z-index:10000;text-align:center;white-space:nowrap}
}
</style>
</head>
<body>

  tickets.forEach(t=>{if(t.status==='Warten auf Partner')t.status='Warten auf Dealer';if(t.status==='In Progress')t.status='Warten auf F-Trucks';if(t.status==='Resolved')t.status='Geschlossen';if(t.status==='Closed')t.status='Geschlossen'});

}

      if(target==='Warten auf Dealer'||target==='Geschlossen'){

    }

function fmtDate(i){if(!i)return'\u2014';return new Date(i).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'})}
function fmtDT(i){if(!i)return'\u2014';const d=new Date(i);return d.toLocaleDateString('de-DE',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function timeAgo(i){const d=Date.now()-new Date(i).getTime();if(d<0)return L('Gerade','Just now');const m=Math.floor(d/60000);if(m<1)return L('Gerade','Just now');if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';const days=Math.floor(h/24);if(days<7)return days+'d';return new Date(i).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'})}
function getVisible(){if(!currentUser)return[];return currentUser.type==='ftd'?tickets:tickets.filter(t=>t.dealerName===currentUser.dealerName)}
function isFtd(){return currentUser&&currentUser.type==='ftd'}
function onHoliday(fid){const n=new Date();return holidays.some(h=>h.fid===fid&&new Date(h.from)<=n&&new Date(h.to)>=n)}
function getAssignee(dn,cat){
  const dl=DEALERS.find(d=>d.name===dn);if(!dl)return HEAD_OF_AS;
  let p='';
  if(cat==='Technisches Ticket')p=dl.tech;
  else if(cat==='Ersatzteil Ticket')p=dl.parts;
  else if(cat==='Sonstiges Ticket')p=dl.other||dl.claim;
  else p=dl.claim;
  if(!p)return HEAD_OF_AS;
  const ids=p.split(',').filter(id=>FTD_TEAM.find(x=>x.id===id));
  const firstAvail=ids.find(id=>!onHoliday(id));
  return firstAvail||ids[0]||HEAD_OF_AS;
}
function getAllAssignees(dn,cat){
  const dl=DEALERS.find(d=>d.name===dn);if(!dl)return [HEAD_OF_AS];
  let p='';
  if(cat==='Technisches Ticket')p=dl.tech;
  else if(cat==='Ersatzteil Ticket')p=dl.parts;
  else if(cat==='Sonstiges Ticket')p=dl.other||dl.claim;
  else if(cat==='Sonstiges Ticket')p=dl.other||dl.claim;
  else p=dl.claim;
  if(!p)return [HEAD_OF_AS];
  const ids=p.split(',').filter(id=>FTD_TEAM.find(x=>x.id===id));
  return ids.length?ids:[HEAD_OF_AS];
}

function showLoginSplash(){

  if(!myNotifs.length)return;

    const tk=tickets.find(x=>x.id===n.ticketId);
    if(tk)byTicket[n.ticketId].ticketNo=tk.ticketNo;

  html+='<div style="font-size:12px;color:var(--text-sec);margin-bottom:12px">'+L('Sie haben','You have')+' <strong style="color:var(--ford-orange)">'+myNotifs.length+'</strong> '+L('ungelesene Benachrichtigungen','unread notifications')+':</div>';
  
  groups.forEach(g=>{
    const tk=tickets.find(x=>x.id===g.ticketId);
    const statusTag=tk?'<span class="tag '+(tk.status==='Geschlossen'?'tag-closed':tk.status==='Warten auf Dealer'?'tag-progress':'tag-open')+'" style="font-size:9px;padding:1px 6px;margin-left:6px">'+tk.status+'</span>':'';
    html+='<div style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:8px;cursor:pointer" onclick="closeModal();openDetail('+g.ticketId+')">';

function renderContent(){const mc=document.getElementById('mc');if(!mc)return;if(currentTab==='dashboard')renderDash(mc);else if(currentTab==='settings')renderSettings(mc);else if(currentTab==='analytics')renderAnalytics(mc);else renderList(mc)}

function renderDash(mc){
  const s=getStats();const recent=getVisible().sort((a,b)=>new Date(b.updated)-new Date(a.updated)).slice(0,5);
  mc.innerHTML=`<div class="stats-row">
    <div class="stat-card"><div class="stat-label">${L('Offen','Open')}</div><div class="stat-value" style="color:var(--info)">${s.open+s.waitDealer+s.waitFTD}</div></div>

  </div>

}

function renderList(mc){
  const cats=CATEGORIES;
  mc.innerHTML=`<div class="filter-bar">
    <input type="text" class="filter-search" id="fSearch" placeholder="${L('Suchen','Search')}..." onkeyup="filterList()">

    <select class="filter-select" id="fSort" onchange="filterList()"><option value="newest">${L('Neueste zuerst','Newest first')}</option><option value="oldest">${L('\u00C4lteste zuerst','Oldest first')}</option></select>
    ${currentTab==='open'?`<select class="filter-select" id="fStatus" onchange="filterList()"><option value="">${L('Alle Offenen','All Open')}</option><option value="Warten auf Dealer">${L('Warten auf Dealer','Waiting on Dealer')}</option><option value="Warten auf F-Trucks">${L('Warten auf F-Trucks','Waiting on F-Trucks')}</option></select>`:``}
  </div><div id="tList"></div>`;

function filterList(){
  let f=getVisible();const q=(document.getElementById('fSearch')?.value||'').toLowerCase();
  const cat=document.getElementById('fCat')?.value;
  const myOnly=document.getElementById('fMyTickets')?.value;
  const sort=document.getElementById('fSort')?.value||'newest';
  if(currentTab==='open'){f=f.filter(t=>t.status!=='Geschlossen');const fSt=document.getElementById('fStatus')?.value;if(fSt)f=f.filter(t=>t.status===fSt)}
  else if(currentTab==='resolved')f=f.filter(t=>t.status==='Geschlossen');
  if(q)f=f.filter(t=>t.title.toLowerCase().includes(q)||t.description.toLowerCase().includes(q)||t.ticketNo.toLowerCase().includes(q)||t.dealerName.toLowerCase().includes(q));
  if(cat)f=f.filter(t=>t.category===cat);
  if(myOnly==='mine'&&isFtd())f=f.filter(t=>t.assignedTo===currentUser.id);
  if(sort==='oldest')f.sort((a,b)=>new Date(a.created)-new Date(b.created));
  else f.sort((a,b)=>new Date(b.updated)-new Date(a.updated));
  document.getElementById('tList').innerHTML=f.length?'<div class="ticket-grid">'+f.map(t=>tCard(t)).join('')+'</div>':'<div class="empty-state"><h3>'+L('Keine Tickets','No tickets')+'</h3></div>';
}

function tCard(t){
  const sMap={'Open':'tag-open','Warten auf Dealer':'tag-progress','Warten auf F-Trucks':'tag-info','Geschlossen':'tag-closed'};
  const sIcon={'Open':'\u25CB','Warten auf Dealer':'\u25D4','Warten auf F-Trucks':'\uD83D\uDCE9','Geschlossen':'\uD83D\uDD12'};
  const needsAction=(isFtd()&&t.status==='Warten auf F-Trucks')||(!isFtd()&&t.status==='Warten auf Dealer');
  return `<div class="ticket-card${needsAction?' needs-action':''}" onclick="openDetail(${t.id})">
    <div class="ticket-header"><span class="ticket-id">${t.ticketNo}</span>${needsAction?'<span style="font-size:9px;color:var(--ford-orange);font-weight:700">\u26A1 '+L('Aktion erforderlich','Action needed')+'</span>':''}<span class="ticket-date">${timeAgo(t.updated)}</span></div>
    <div class="ticket-title">${t.title}</div>
    <div style="font-size:11px;color:var(--ford-orange);font-weight:600;margin-bottom:4px">\uD83C\uDFE2 ${t.dealerName}${t.dealerCity?' \u2014 '+t.dealerCity:''}</div>
    <div class="ticket-desc">${t.description}</div>
    <div class="ticket-meta"><span class="tag ${sMap[t.status]||''}">${sIcon[t.status]||''} ${t.status}</span><span class="tag tag-cat">${t.category.split(' ')[0]}</span><span class="tag ${t.mobilized?'tag-mob':'tag-immob'}">${t.mobilized?'Mob':'Immob'}</span>${(t.media||[]).length?`<span class="tag tag-media">\uD83D\uDCCE${t.media.length}</span>`:''}</div></div>`;
}

  });
  document.getElementById('mOverlay').innerHTML='<div class="modal" style="max-width:950px"><div class="modal-hdr"><h3>\u23F1 '+personName+' \u2014 '+L('Reaktionszeit Details','Response Time Details')+'</h3><button class="close-btn" onclick="closeModal()">\u2715</button></div><div class="modal-body" style="max-height:70vh;overflow-y:auto"><div style="display:flex;gap:12px;margin-bottom:14px"><div style="flex:1;text-align:center;padding:10px;background:var(--bg);border-radius:var(--radius-sm)"><div style="font-size:10px;color:var(--text-sec)">\u00D8 '+L('Durchschnitt','Average')+'</div><div style="font-size:20px;font-weight:700">'+avg+'h</div></div><div style="flex:1;text-align:center;padding:10px;background:var(--success-bg);border-radius:var(--radius-sm)"><div style="font-size:10px;color:var(--success)">'+L('Schnellste','Fastest')+'</div><div style="font-size:20px;font-weight:700;color:var(--success)">'+fastest+'h</div></div><div style="flex:1;text-align:center;padding:10px;background:var(--danger-bg);border-radius:var(--radius-sm)"><div style="font-size:10px;color:var(--danger)">'+L('Langsamste','Slowest')+'</div><div style="font-size:20px;font-weight:700;color:var(--danger)">'+slowest+'h</div></div><div style="flex:1;text-align:center;padding:10px;background:var(--bg);border-radius:var(--radius-sm)"><div style="font-size:10px;color:var(--text-sec)">'+L('Ohne Antwort','No Response')+'</div><div style="font-size:20px;font-weight:700;color:var(--warning)">'+noResp+'</div></div></div><div style="font-size:10px;color:var(--text-mut);margin-bottom:8px">\u2139\uFE0F '+L('Berechnung: Zeit von F-Trucks Kommentar bis zur Antwort des Dealer-Kontakts. Klicke auf eine Zeile um das Ticket zu \u00F6ffnen.','Calculation: Time from F-Trucks comment to dealer contact reply. Click a row to open the ticket.')+'</div><table class="settings-table"><thead><tr><th>TICKET</th><th>'+L('TITEL','TITLE')+'</th><th>F-TRUCKS</th><th>'+L('F-TRUCKS KOMM.','FTD COMMENT')+'</th><th>'+L('DEALER ANT function showAllDealerResponseTimes(){
  const ftdNames=FTD_TEAM.map(m=>m.name);
  const compResp={};
  tickets.forEach(t=>{
    const ftdFirst=(t.comments||[]).find(c=>ftdNames.includes(c.author));
    if(!ftdFirst)return;
    const dealerComments=(t.comments||[]).filter(c=>c.author!=='System'&&!ftdNames.includes(c.author));
    const dealerReply=dealerComments.find(c=>new Date(c.time)>new Date(ftdFirst.time));
    if(dealerReply){
      const rt=(new Date(dealerReply.time)-new Date(ftdFirst.time))/3600000;
      if(rt>0){if(!compResp[t.dealerName])compResp[t.dealerName]={total:0,count:0};compResp[t.dealerName].total+=rt;compResp[t.dealerName].count++}
    }
  });
  const sorted=Object.entries(compResp).map(([name,d])=>({name,avg:(d.total/d.count).toFixed(1),count:d.count})).sort((a,b)=>parseFloat(a.avg)-parseFloat(b.avg));
  let rows='';sorted.forEach(function(d){
    const col=parseFloat(d.avg)<=8?'var(--success)':parseFloat(d.avg)<=24?'var(--warning)':'var(--danger)';
    rows+='<tr style="cursor:pointer" onclick="closeModal();setAnalyticsDealer(\''+d.name.replace(/'/g,"\\'")+'\')" ><td style="font-size:12px;font-weight:600">'+d.name+'</td><td><strong style="color:'+col+'">'+d.avg+'h</strong></td><td style="font-size:11px">'+d.count+'</td></tr>';
  });
  document.getElementById('mOverlay').innerHTML='<div class="modal" style="max-width:700px"><div class="modal-hdr"><h3>\u23F1 '+L('Reaktionszeit alle Dealer','All Dealer Response Times')+' ('+sorted.length+')</h3><button class="close-btn" onclick="closeModal()">\u2715</button></div><div class="modal-body" style="max-height:70vh;overflow-y:auto"><table class="settings-table"><thead><tr><th>DEALER</th><th>\u00D8 '+L('ZEIT','TIME')+'</th><th>TICKETS</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">'+L('Schlie\u00DFen','Close')+'</button></div></div>';

function showTranslate(id){

  const deWords=['der','die','das','und','bei','ist','nicht','ein','mit','von','f\u00FCr','auf','wird','wurde','zum','zur','dem','den','des','nach','sich','aus','auch','wie','noch','werden','hat','ich','wir','sie','sind','kann','diese','einem','einer','haben','nur','oder','aber','vor','schon','wenn','mehr','keine','durch','bereits'];
  const words=(t.title+' '+t.description).toLowerCase().split(/\s+/);
  const deScore=words.filter(w=>deWords.includes(w)).length;
  const hasUmlauts=/[\u00E4\u00F6\u00FC\u00DF\u00C4\u00D6\u00DC]/.test(t.title+t.description);
  const isDE=deScore>=3||hasUmlauts;
  
  // Mock translation dictionary EN→DE

function addComment(id){const inp=document.getElementById('cInput');const txt=inp.value.trim();if(!txt)return;const t=tickets.find(x=>x.id===id);if(!t||t.status==='Geschlossen')return;t.comments=t.comments||[];const authorName=(!isFtd()&&currentUser.dealerName)?currentUser.name+' ('+currentUser.dealerName+')':currentUser.name;t.comments.push({author:authorName,text:txt,time:new Date().toISOString()});
  // Auto status change based on who comments
  if(t.status!=='Geschlossen'){

  }

function doCloseTicket(id){const descEl=document.getElementById('closeDesc');const reasonEl=document.getElementById('closeReason');const desc=descEl?descEl.value.trim():'';const reason=reasonEl?reasonEl.value:'';const t2=tickets.find(x=>x.id===id);if(t2&&t2.category!=='Ersatzteil Ticket'&&(!desc||desc.length<15)){alert(L('Mind. 15 Zeichen f\u00FCr Abschlussbeschreibung','Min. 15 chars for closing description'));return}const t=tickets.find(x=>x.id===id);if(!t)return;t.status='Closed';t.closingDesc=desc;t.closeReason=reason;addLog(id,currentUser.name,'Closed: '+reason);saveState();closeModal();openDetail(id);renderApp()}

function syncAlleCheck(){const singles=document.querySelectorAll('.fSysSingle');const alle=document.getElementById('fSysAlle');if(!alle)return;const allChecked=[...singles].every(c=>c.checked);alle.checked=allChecked}
function setupFU(){const dz=document.getElementById('dropZ');const fi=document.getElementById('fInput');if(!dz||!fi)return;dz.onclick=()=>fi.click();dz.ondragover=e=>{e.preventDefault();dz.classList.add('dragover')};dz.ondragleave=()=>dz.classList.remove('dragover');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('dragover');handleF(e.dataTransfer.files)};fi.onchange=()=>handleF(fi.files)}
function handleF(fl){const ok=['image/jpeg','application/pdf','video/mp4'];Array.from(fl).forEach(f=>{if(!ok.includes(f.type))return;const r=new FileReader();r.onload=e=>{uploadedFiles.push({name:f.name,type:f.type,data:e.target.result});renderFP()};r.readAsDataURL(f)})}
function renderFP(){const c=document.getElementById('fPrevs');if(!c)return;c.innerHTML=uploadedFiles.map((f,i)=>{if(f.type==='application/pdf')return`<div class="file-preview">PDF<button class="rm" onclick="rmF(${i})">\u2715</button></div>`;if(f.type?.startsWith('video'))return`<div class="file-preview">\u25B6MP4<button class="rm" onclick="rmF(${i})">\u2715</button></div>`;return`<div class="file-preview"><img src="${f.data}"><button class="rm" onclick="rmF(${i})">\u2715</button></div>`}).join('')}
function rmF(i){uploadedFiles.splice(i,1);renderFP()}

function saveNew(){
  const title=document.getElementById('fTitle').value.trim();const desc=document.getElementById('fDesc').value.trim();
  const cat=document.getElementById('fCat2').value;const sub=document.getElementById('fSub').value;
  const pri='Medium';const mobEl=document.getElementById('fMob');const mob=mobEl&&mobEl.offsetParent!==null?mobEl.value==='true':true;
  const vin=document.getElementById('fVin')?.value.trim()||'';
  const rsa=document.getElementById('fRsa')?.value.trim()||'';
  const eh=document.getElementById('fEngHrs')?.value.trim()||'';
  const ml=document.getElementById('fMileage')?.value.trim()||'';
  
  const missing=[];
  if(!title)missing.push(L('Titel','Title'));
  
  // Extra fields object
  const extra={};
  
  // Technisches Ticket validation
  if(cat==='Technisches Ticket'){
    if(!vin)missing.push('VIN');
    if(!eh)missing.push(L('Motorstunden','Engine Hours'));
    if(!ml)missing.push(L('Kilometerstand','Mileage'));
    extra.probDate=document.getElementById('fProbDate')?.value||'';
    extra.techDesc=document.getElementById('fTechDesc')?.value.trim()||'';
    extra.stepsChecked=document.getElementById('fStepsChecked')?.value.trim()||'';
    extra.refTechFO=document.getElementById('fRefTechFO')?.value.trim()||'';
    extra.refLaborFO=document.getElementById('fRefLaborFO')?.value.trim()||'';
    extra.refWarrantyFO=document.getElementById('fRefWarrantyFO')?.value.trim()||'';
    extra.refGoodwillFO=document.getElementById('fRefGoodwillFO')?.value.trim()||'';
    if(!extra.probDate)missing.push(L('Datum Problem erstmalig','Date problem first occurred'));
    if(!extra.techDesc||extra.techDesc.length<15)missing.push(L('Problem Beschreibung (mind. 15 Zeichen)','Problem Description (min. 15 chars)'));
    if(!extra.stepsChecked)missing.push(L('Schritte bis jetzt gepr\u00FCft','Steps checked so far'));
  }
  
  // Ersatzteil Ticket validation
  if(cat==='Ersatzteil Ticket'){
    extra.refSparePartFO=document.getElementById('fRefSparePartFO')?.value.trim()||'';
    if(sub==='Ersatzteil Ermittlung'&&!vin)missing.push('VIN');
    if(sub==='Ersatzteil Ersetzung'){
      extra.partNo=document.getElementById('fPartNo')?.value.trim()||'';
      if(!extra.partNo)missing.push(L('Ersatzteilnummer','Part Number'));
    }
  }
  
  // Sonstiges Ticket validation
  if(cat==='Sonstiges Ticket'){
    if(sub==='Benutzer Anlegen'){
      extra.newFirst=document.getElementById('fNewFirst')?.value.trim()||'';
      extra.newLast=document.getElementById('fNewLast')?.value.trim()||'';
      extra.newEmail=document.getElementById('fNewEmail')?.value.trim()||'';
      extra.newFunc=document.getElementById('fNewFunc')?.value.trim()||'';
      extra.systems=[...document.querySelectorAll('.fSys:checked')].map(c=>c.value).filter(v=>v!=='Alle');
      if(!extra.newFirst)missing.push(L('Vorname','First Name'));
      if(!extra.newLast)missing.push(L('Nachname','Last Name'));
      if(!extra.newEmail)missing.push('E-Mail');
      if(!extra.newFunc)missing.push(L('Funktion','Function'));
      if(!extra.systems.length)missing.push(L('System (mind. 1 ausw\u00E4hlen)','System (select at least 1)'));
    }
    if(sub==='Benutzer L\u00F6schen'){
      extra.delUsername=document.getElementById('fDelUser')?.value.trim()||'';
      extra.systems=[...document.querySelectorAll('.fSys:checked')].map(c=>c.value).filter(v=>v!=='Alle');
      if(!extra.delUsername)missing.push(L('Benutzername','Username'));
    }
    if(sub==='Benutzer Zugangsprobleme / Passwort'){
      extra.accUsername=document.getElementById('fAccUser')?.value.trim()||'';
      if(!extra.accUsername)missing.push(L('Benutzername','Username'));
    }
  }
  
  // Show all missing fields
  if(missing.length){
    const warn=document.getElementById('formWarning');
    const msg='\u26A0 '+L('Bitte f\u00FCllen Sie folgende Pflichtfelder aus','Please fill in the following required fields')+':\n\n\u2022 '+missing.join('\n\u2022 ');
    if(warn){warn.innerHTML='<div style="background:#FEF2F2;border:1px solid var(--danger);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:10px"><div style="font-size:12px;font-weight:700;color:var(--danger);margin-bottom:4px">\u26A0 '+L('Pflichtfelder fehlen','Required fields missing')+'</div><div style="font-size:11px;color:var(--danger)">'+missing.map(m=>'\u2022 '+m).join('<br>')+'</div></div>';warn.scrollIntoView({behavior:'smooth',block:'start'})}
    else{alert(msg)}
    return;
  }
  
  let dn,dc,at;
  if(currentUser.type==='dealer'){dn=currentUser.dealerName;dc=currentUser.dealerCity;at=getAssignee(dn,cat)}
  else{const di=parseInt(document.getElementById('fDealer').value);const d=DEALERS[di];dn=d.name;dc=d.city;at=document.getElementById('fAssign').value}
  const now=new Date().toISOString();
  const creatorName=(currentUser.type==='dealer'&&currentUser.dealerName)?currentUser.name+' ('+currentUser.dealerName+')':currentUser.name;
  const initStatus=currentUser.type==='dealer'?'Warten auf F-Trucks':'Open';
  const initAudit=currentUser.type==='dealer'?[{who:'System',when:now,what:'Status: Open \u2192 Warten auf F-Trucks'}]:[{who:creatorName,when:now,what:'Ticket erstellt'}];
  const t={id:nextTid++,ticketNo:'FTD-'+String(nextTid-1).padStart(4,'0'),title,description:desc,category:cat,subcat:sub,priority:pri,status:initStatus,dealerName:dn,dealerCity:dc,assignedTo:at,mobilized:mob,vin,rsaJobNo:rsa,engineHours:eh,mileage:ml,extra,media:[...uploadedFiles],comments:[{author:creatorName,text:'Neues Ticket erstellt',time:now}],auditLog:initAudit,created:now,updated:now,closingDesc:'',closeReason:''};
  tickets.unshift(t);
  // Notify all assigned people (e.g. both Sandra and Niels for spare parts)
  const allNotify=getAllAssignees(dn,cat);
  allNotify.forEach(aid=>{addNotif(aid,'Neu: '+t.ticketNo+' von '+dn,t.id)});
  saveState();closeModal();renderApp();
}

function filterDealerSettings(){

    const contacts=(d.contacts||[]);
    return'<div style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin-bottom:8px">'+
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'+

function doAddDealerSettings(){
  const name=document.getElementById('ndName2').value.trim();const city=document.getElementById('ndCity2').value.trim();
  if(!name||!city){alert(L('Name und Stadt erforderlich','Name and city required'));return}
  const contacts=[];
  document.querySelectorAll('.ndcName').forEach((el,i)=>{
    const n=el.value.trim();if(!n)return;
    const roles=document.querySelectorAll('.ndcRole');
    const emails=document.querySelectorAll('.ndcEmail');
    const phones=document.querySelectorAll('.ndcPhone');
    contacts.push({name:n,role:roles[i]?.value.trim()||'',email:emails[i]?.value.trim()||'',phone:phones[i]?.value.trim()||''});
  });

  // Repeat issues removed per client feedback

      if(dealerReply){
        const rt=(new Date(dealerReply.time)-new Date(ftdFirst.time))/3600000;
        const pName=dealerReply.author.replace(/\s*\(.*\)$/,'');
        if(rt>0){if(!personResp[pName])personResp[pName]={total:0,count:0};personResp[pName].total+=rt;personResp[pName].count++}
      }
    });
    const personList=Object.entries(personResp).map(([name,d])=>[name,(d.total/d.count).toFixed(1)]).sort((a,b)=>a[1]-b[1]);
    if(personList.length){
      const mx=Math.max(...personList.map(x=>parseFloat(x[1])),1);
      allDealerRespHtml=personList.map(function([name,hrs]){const col=parseFloat(hrs)<=8?'success':parseFloat(hrs)<=24?'warning':'danger';return'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer" onclick="showDealerPersonResponseDetail(\''+name.replace(/'/g,"\\\\'")+'\')"><span style="font-size:11px;width:80px;flex-shrink:0;color:var(--text-sec)">'+name+'</span>'+bar(parseFloat(hrs),mx,col)+'<strong style="font-size:12px;width:40px;text-align:right;color:var(--'+col+')">'+hrs+'h</strong></div>'}).join('');
    }
  } else {
    // All dealers: show per-company response times
    const dealerCompanyResp={};
    all.forEach(t=>{
      const ftdFirst=(t.comments||[]).find(c=>ftdNamesSet2.includes(c.author));
      if(!ftdFirst)return;
      const dealerComments=(t.comments||[]).filter(c=>c.author!=='System'&&!ftdNamesSet2.includes(c.author));
      const dealerReply=dealerComments.find(c=>new Date(c.time)>new Date(ftdFirst.time));
      if(dealerReply){
        const rt=(new Date(dealerReply.time)-new Date(ftdFirst.time))/3600000;
        if(rt>0){if(!dealerCompanyResp[t.dealerName])dealerCompanyResp[t.dealerName]={total:0,count:0};dealerCompanyResp[t.dealerName].total+=rt;dealerCompanyResp[t.dealerName].count++}
      }
    });
    const dealerCompanyList=Object.entries(dealerCompanyResp).map(([name,d])=>[name,(d.total/d.count).toFixed(1)]).sort((a,b)=>a[1]-b[1]);
    if(dealerCompanyList.length){
      const dcTop10=dealerCompanyList.slice(0,10);
      const mx=Math.max(...dcTop10.map(x=>parseFloat(x[1])),1);
      allDealerRespHtml=dcTop10.map(function([name,hrs]){const col=parseFloat(hrs)<=8?'success':parseFloat(hrs)<=24?'warning':'danger';return'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer" onclick="setAnalyticsDealer(\''+name.replace(/'/g,"\\\\'")+'\')"><span style="font-size:11px;width:100px;flex-shrink:0;color:var(--text-sec)">'+name.substring(0,22)+'</span>'+bar(parseFloat(hrs),mx,col)+'<strong style="font-size:12px;width:40px;text-align:right;color:var(--'+col+')">'+hrs+'h</strong></div>'}).join('');
      if(dealerCompanyList.length>10)allDealerRespHtml+='<div style="text-align:right;margin-top:8px"><button class="btn btn-sm btn-secondary" onclick="showAllDealerResponseTimes()" style="font-size:11px">'+L('Alle anzeigen','View All')+' ('+dealerCompanyList.length+')</button></div>';
    }
  }

  mc.innerHTML=`
  <div class="analytics-flex" style="display:flex;gap:14px;align-items:flex-start">
    <!-- LEFT SIDEBAR -->
    <div class="analytics-sidebar" style="width:220px;flex-shrink:0;position:sticky;top:66px">
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
        <div style="padding:10px 12px;background:var(--ford-blue);color:#fff;font-size:12px;font-weight:700">\uD83C\uDFE2 ${L('Dealer Filter','Dealer Filter')}</div>
        <div style="max-height:calc(100vh - 160px);overflow-y:auto">
          <div onclick="setAnalyticsDealer('')" style="padding:8px 12px;font-size:11px;cursor:pointer;border-bottom:1px solid var(--border);font-weight:${!analyticsDealer?'700':'400'};color:${!analyticsDealer?'var(--ford-orange)':'var(--text)'};background:${!analyticsDealer?'var(--bg)':'transparent'}">\u25C9 ${L('Alle Dealer','All Dealers')} <span style="float:right;color:var(--text-mut);font-size:10px">${allTickets.length}</span></div>
          ${activeDealerNames.map(dn=>{const cnt=dealerTicketCounts[dn]||0;const sel=analyticsDealer===dn;return`<div onclick="setAnalyticsDealer('${dn.replace(/'/g,"\\\\'")}')" style="padding:7px 12px;font-size:10px;cursor:pointer;border-bottom:1px solid var(--border);font-weight:${sel?'700':'400'};color:${sel?'var(--ford-orange)':'var(--text)'};background:${sel?'var(--bg)':'transparent'}" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='${sel?'var(--bg)':'transparent'}'"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${sel?'var(--ford-orange)':'var(--border)'};margin-right:6px"></span>${dn.length>28?dn.substring(0,28)+'...':dn} <span style="float:right;color:var(--text-mut);font-size:9px">${cnt}</span></div>`}).join('')}
        </div>
      </div>
    </div>
    <!-- RIGHT CONTENT -->
    <div class="analytics-content" style="flex:1;min-width:0">
    ${analyticsDealer?`<div style="margin-bottom:12px;padding:10px 14px;background:var(--ford-blue);color:#fff;border-radius:var(--radius);display:flex;justify-content:space-between;align-items:center"><div><strong style="font-size:14px">\uD83C\uDFE2 ${analyticsDealer}</strong><br><span style="font-size:11px;opacity:0.8">${all.length} ${L('Tickets','tickets')} | ${L('Gefilterte Ansicht','Filtered view')}</span></div><button onclick="setAnalyticsDealer('')" style="background:rgba(255,255,255,0.15);border:none;color:#fff;padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:11px;font-family:var(--font)">\u2715 ${L('Filter entfernen','Clear filter')}</button></div>`:''}
    <div class="mobile-dealer-filter" style="display:none;margin-bottom:12px">
      <select onchange="setAnalyticsDealer(this.value)" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--bg-input);color:var(--text);font-family:var(--font)">
        <option value="" ${!analyticsDealer?'selected':''}>\uD83C\uDFE2 ${L('Alle Dealer','All Dealers')} (${allTickets.length})</option>
        ${activeDealerNames.map(dn=>`<option value="${dn.replace(/'/g,"&#39;")}" ${analyticsDealer===dn?'selected':''}>${dn} (${dealerTicketCounts[dn]||0})</option>`).join('')}
      </select>
    </div>
    <div class="stats-row" style="grid-template-columns:repeat(auto-fit,minmax(100px,1fr))">
      <div class="stat-card"><div class="stat-label">${L("Gesamt","Total")}</div><div class="stat-value">${all.length}</div></div>
      <div class="stat-card"><div class="stat-label">${L("Offen","Open")}</div><div class="stat-value" style="color:var(--info)">${open.length}</div></div>
      <div class="stat-card"><div class="stat-label">${L("Wartend","Waiting")}</div><div class="stat-value" style="color:var(--warning)">${prog.length}</div></div>
      <div class="stat-card"><div class="stat-label">${L("Geschlossen","Closed")}</div><div class="stat-value" style="color:var(--success)">${closed.length}</div></div>
      <div class="stat-card"><div class="stat-label">${L("Immobilisiert","Immobilized")}</div><div class="stat-value" style="color:var(--danger)">${immob.length}</div></div>
      <div class="stat-card"><div class="stat-label">${L("\u00D8 Tage bis Abschluss","Avg Days to Close")}</div><div class="stat-value">${avgResTime}</div></div>
      <div class="stat-card"><div class="stat-label">${L("L\u00F6sungsrate","Close Rate")}</div><div class="stat-value" style="color:var(--success)">${resRate}%</div></div>
    </div>

    <div class="analytics-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      ${card(L('Tickets nach Kategorie','Tickets by Category'), CATEGORIES.map(c=>{const cnt=catCounts[c]||0;const mx=Math.max(...Object.values(catCounts));return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer" onclick="drillDown('${c}',t=>t.category==='${c}')"><span style="font-size:11px;width:120px;flex-shrink:0;color:var(--text-sec)">${c.split(' ')[0]}</span>${bar(cnt,mx,'ford-orange')}<strong style="font-size:12px;width:30px;text-align:right">${cnt}</strong></div>`}).join(''))}
      ${card(L('Tickets nach Status','Tickets by Status'), STATUSES.filter(s=>s!=='Open').map(s=>{const cnt=all.filter(t=>t.status===s).length;const mx=Math.max(...STATUSES.map(s2=>all.filter(t=>t.status===s2).length),1);const col=s==='Open'?'info':s==='Warten auf Dealer'?'warning':s==='Warten auf F-Trucks'?'info':'text-mut';return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer" onclick="drillDown('Status: ${s}',t=>t.status==='${s}')"><span style="font-size:11px;width:80px;flex-shrink:0;color:var(--text-sec)">${s}</span>${bar(cnt,mx,col)}<strong style="font-size:12px;width:30px;text-align:right">${cnt}</strong></div>`}).join(''))}
    </div>

    <div class="analytics-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      ${card(L('\u23F1 Ticket-Alter','\u23F1 Ticket Aging'), Object.entries(ageBuckets).map(([label,cnt])=>{const mx=Math.max(...Object.values(ageBuckets),1);const col=ageColors[label];return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer" onclick="drillDown('Aging: ${label}',t=>{if(t.status==='Geschlossen')return false;const d=(Date.now()-new Date(t.created))/86400000;if('${label}'==='0-2d')return d<=2;if('${label}'==='3-5d')return d>2&&d<=5;if('${label}'==='6-10d')return d>5&&d<=10;return d>10})"><span style="font-size:11px;width:50px;flex-shrink:0;color:var(--text-sec)">${label}</span>${bar(cnt,mx,col)}<strong style="font-size:12px;width:30px;text-align:right;color:var(--${col})">${cnt}</strong></div>`}).join('')+(ageBuckets['10d+']?'<div style="margin-top:8px;font-size:11px;color:var(--danger);font-weight:600">\u26A0 '+ageBuckets['10d+']+' '+L('Tickets offen seit \u00FCber 10 Tagen','tickets open for more than 10 days')+'</div>':''))}
      ${card(L('\uD83D\uDC64 Mitarbeiter-Auslastung (Technisch)','\uD83D\uDC64 Staff Workload (Technical)'), assignList.length?assignList.map(([name,cnt])=>{const mx=Math.max(...assignList.map(x=>x[1]),1);return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer" onclick="drillDown('${name}',t=>t.category==='Technisches Ticket'&&getFtdName(t.assignedTo)==='${name}')"><span style="font-size:11px;width:80px;flex-shrink:0;color:var(--text-sec)">${name}</span>${bar(cnt,mx,'info')}<strong style="font-size:12px;width:30px;text-align:right">${cnt}</strong></div>`}).join(''):'<div style="color:var(--text-mut);font-size:12px">'+L('Keine aktiven Tickets','No active tickets')+'</div>')}
    </div>

    <div class="analytics-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      ${card(L('\u23F1 \u00D8 Reaktionszeit F-Trucks (h)','\u23F1 Avg FTD Response Time (h)'), staffResponseList.length?staffResponseList.map(([name,hrs])=>{const mx=Math.max(...staffResponseList.map(x=>parseFloat(x[1])),1);const col=parseFloat(hrs)<=4?'success':parseFloat(hrs)<=12?'warning':'danger';return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer" onclick="showStaffResponseDetail('${name}')"><span style="font-size:11px;width:80px;flex-shrink:0;color:var(--text-sec)">${name}</span>${bar(parseFloat(hrs),mx,col)}<strong style="font-size:12px;width:40px;text-align:right;color:var(--${col})">${hrs}h</strong></div>`}).join(''):'<div style="color:var(--text-mut);font-size:12px">'+L('Keine Reaktionszeitdaten','No response time data')+'</div>')}
      ${card(L('\u23F1 \u00D8 Reaktionszeit Dealer (h)','\u23F1 Avg Dealer Response Time (h)'), allDealerRespHtml||'<div style="color:var(--text-mut);font-size:12px">'+L('Keine Reaktionszeitdaten','No response time data')+'</div>')}
    </div>

    
    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px">
      <strong style="font-size:13px;display:block;margin-bottom:10px">${L("\uD83D\uDCC8 Ticket-Volumen-Trend (14 Tage)","\uD83D\uDCC8 Volume Trend (14 days)")}</strong>
      <div style="display:flex;align-items:flex-end;gap:4px;height:160px;padding-top:8px">
        ${trendEntries.map(([date,cnt])=>{const h=trendMax?Math.round(cnt/trendMax*120):0;return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><span style="font-size:9px;color:var(--text-sec)">${cnt||''}</span><div style="width:100%;height:${h}px;background:var(--ford-orange);border-radius:3px 3px 0 0;min-height:${cnt?4:1}px;opacity:${cnt?1:0.2}"></div><span style="font-size:8px;color:var(--text-mut);writing-mode:vertical-lr;transform:rotate(180deg);height:35px">${date}</span></div>`}).join('')}
      </div>
    </div>

    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px">
      <strong style="font-size:13px;display:block;margin-bottom:10px">\uD83D\uDCE6 ${L("Ersatzteil-Ticketübersicht","Spare Parts Tickets Overview")}</strong>
      <table class="settings-table"><thead><tr><th>${L('Unterkategorie','Subcategory')}</th><th>Open</th><th>${L('Wartend','Waiting')}</th><th>Geschlossen</th><th>Total</th></tr></thead><tbody>
      ${etSubs.map(s=>{const d=etPipeline[s]||{open:0,prog:0,resolved:0};const tot=d.open+d.prog+d.resolved;return tot?`<tr><td style="font-size:11px">${s}</td><td>${d.open?`<span class="tag tag-open">${d.open}</span>`:'\u2014'}</td><td>${d.prog?`<span class="tag tag-progress">${d.prog}</span>`:'\u2014'}</td><td>${d.resolved?`<span class="tag tag-resolved">${d.resolved}</span>`:'\u2014'}</td><td><strong>${tot}</strong></td></tr>`:''}).join('')}
      </tbody></table>
    </div>

    <div class="analytics-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
    ${vehicleStatusHtml}
    ${card((analyticsDealer?L('\uD83C\uDFC6 Dealer Scorecard','\uD83C\uDFC6 Dealer Scorecard'):L('\uD83C\uDFC6 Dealer Scorecard \u2014 Top 10','\uD83C\uDFC6 Dealer Scorecard \u2014 Top 10')), topDealers10.map(([name,cnt])=>{const dt=all.filter(t=>t.dealerName===name);const dO=dt.filter(t=>t.status==='Open'||t.status==='Warten auf Dealer'||t.status==='Warten auf F-Trucks').length;const dI=dt.filter(t=>!t.mobilized&&t.status!=='Geschlossen').length;const dR=dt.filter(t=>t.status==='Geschlossen').length;const rate=cnt?(dR/cnt*100).toFixed(0):'0';return'<tr><td style="font-size:10px">'+name+'</td><td><strong>'+cnt+'</strong></td><td>'+(dO?'<span class="tag tag-open">'+dO+'</span>':'\u2014')+'</td><td>'+(dI?'<span class="tag tag-immob">'+dI+'</span>':'\u2014')+'</td><td>'+dR+'</td><td><strong style="color:'+(parseInt(rate)>=70?'var(--success)':parseInt(rate)>=40?'var(--warning)':'var(--danger)')+'">'+rate+'%</strong></td></tr>'}).join('')?'<table class="settings-table"><thead><tr><th>Dealer</th><th>Tickets</th><th>Open</th><th>Immob.</th><th>Geschl.</th><th>Rate</th></tr></thead><tbody>'+topDealers10.map(([name,cnt])=>{const dt=all.filter(t=>t.dealerName===name);const dO=dt.filter(t=>t.status!=='Geschlossen').length;const dI=dt.filter(t=>!t.mobilized&&t.status!=='Geschlossen').length;const dR=dt.filter(t=>t.status==='Geschlossen').length;const rate=cnt?(dR/cnt*100).toFixed(0):'0';return'<tr><td style="font-size:10px">'+name+'</td><td><strong>'+cnt+'</strong></td><td>'+(dO?'<span class="tag tag-open">'+dO+'</span>':'\u2014')+'</td><td>'+(dI?'<span class="tag tag-immob">'+dI+'</span>':'\u2014')+'</td><td>'+dR+'</td><td><strong style="color:'+(parseInt(rate)>=70?'var(--success)':parseInt(rate)>=40?'var(--warning)':'var(--danger)')+'">'+rate+'%</strong></td></tr>'}).join('')+'</tbody></table>'+(topDealers.length>10?'<div style="text-align:right;margin-top:8px"><button class="btn btn-sm btn-secondary" onclick="showAllDealerScorecard()" style="font-size:11px">'+L('Alle anzeigen','View All')+' ('+topDealers.length+')</button></div>':''):'<div style="color:var(--text-mut);font-size:12px">Keine Dealer-Daten</div>')}
    </div>

    ${problemVehiclesHtml}


    
    </div><!-- /RIGHT CONTENT -->
  </div><!-- /FLEX LAYOUT -->
  `;
}


// INIT
loadState();
renderApp();
</script>
</body>
</html>

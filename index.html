<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>F-Trucks Deutschland — AfterSales Ticket System</title>
<meta name="theme-color" content="#003478">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FTD Tickets">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="FTD AfterSales">
<meta name="description" content="F-Trucks Deutschland AfterSales Ticket System">
<script>
function generateIcon(size){const c=document.createElement('canvas');c.width=size;c.height=size;const x=c.getContext('2d');x.fillStyle='#003478';x.fillRect(0,0,size,size);x.fillStyle='#F26522';x.fillRect(0,size*0.78,size,size*0.22);x.fillStyle='#FFFFFF';x.font='bold '+Math.round(size*0.22)+'px Arial';x.textAlign='center';x.fillText('FTD',size/2,size*0.38);x.font=Math.round(size*0.11)+'px Arial';x.fillText('AfterSales',size/2,size*0.55);x.fillText('Tickets',size/2,size*0.70);return c.toDataURL('image/png')}
window.addEventListener('DOMContentLoaded',()=>{
  const manifest={name:'F-Trucks Deutschland AfterSales Ticket System',short_name:'FTD Tickets',start_url:location.href,display:'standalone',orientation:'portrait',background_color:'#003478',theme_color:'#003478',icons:[]};
  [72,96,128,144,152,192,384,512].forEach(s=>{manifest.icons.push({src:generateIcon(s),sizes:s+'x'+s,type:'image/png',purpose:'any maskable'})});
  const mLink=document.createElement('link');mLink.rel='manifest';mLink.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));document.head.appendChild(mLink);
  const ai=document.createElement('link');ai.rel='apple-touch-icon';ai.href=generateIcon(180);document.head.appendChild(ai);
});
if('serviceWorker' in navigator){const sw=`const C='ftd-v1';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll([self.location.href])).then(()=>self.skipWaiting()))});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{if(resp.status===200){const c=resp.clone();caches.open(C).then(cache=>cache.put(e.request,c))}return resp}).catch(()=>caches.match(self.location.href)))})});`;navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'})),{scope:location.pathname}).catch(()=>{})}
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('installBtn');if(b)b.style.display='inline-flex';const li=document.getElementById('loginInstall');if(li)li.style.display='block'});
function installPWA(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;const b=document.getElementById('installBtn');if(b)b.style.display='none'})}}
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root,[data-theme="light"]{--ford-blue:#003478;--ford-orange:#F26522;--bg:#F0F2F5;--bg-card:#fff;--bg-input:#fff;--border:#E2E8F0;--text:#1A1A2E;--text-sec:#64748B;--text-mut:#94A3B8;--success:#10B981;--success-bg:#ECFDF5;--warning:#F59E0B;--warning-bg:#FEF3C7;--danger:#EF4444;--danger-bg:#FEF2F2;--info:#3B82F6;--info-bg:#EFF6FF;--radius:10px;--radius-sm:6px;--font:'Segoe UI',system-ui,-apple-system,sans-serif;--mono:'Consolas',monospace}
[data-theme="dark"]{--ford-blue:#4A90D9;--ford-orange:#F26522;--bg:#0F172A;--bg-card:#1E293B;--bg-input:#334155;--border:#334155;--text:#E2E8F0;--text-sec:#94A3B8;--text-mut:#64748B;--success:#34D399;--success-bg:#064E3B;--warning:#FBBF24;--warning-bg:#78350F;--danger:#F87171;--danger-bg:#7F1D1D;--info:#60A5FA;--info-bg:#1E3A5F}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:#003478;color:#fff;padding:0 16px;padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer}
.icon-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;position:relative}
.icon-btn:hover{background:rgba(255,255,255,0.1)}
.notif-badge{position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.notif-panel{position:fixed;top:52px;right:10px;width:320px;max-height:400px;overflow-y:auto;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 30px rgba(0,0,0,0.15);z-index:200;display:none}
.notif-panel.active{display:block}
.notif-panel-hdr{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}
.notif-item{padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer}
.notif-item.unread{background:var(--info-bg)}
.notif-item:hover{background:var(--bg)}
.notif-time{font-size:10px;color:var(--text-mut);margin-top:3px}
.tab-nav{display:flex;gap:4px;padding:8px 16px;background:var(--bg-card);border-bottom:1px solid var(--border);overflow-x:auto;flex-wrap:nowrap}
.tab-btn{padding:6px 14px;border:none;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;background:transparent;color:var(--text-sec);font-family:var(--font)}
.tab-btn.active{background:var(--ford-blue);color:#fff}
.tab-btn:hover:not(.active){background:var(--bg)}
.badge{background:rgba(0,0,0,0.1);padding:1px 6px;border-radius:10px;font-size:10px;margin-left:4px}
.tab-btn.active .badge{background:rgba(255,255,255,0.2)}
.main{padding:16px;max-width:1200px;margin:0 auto;padding-bottom:80px}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--bg-card);border-radius:var(--radius);padding:40px 36px;width:100%;max-width:500px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.login-logo{text-align:center;margin-bottom:20px}
.login-logo img{height:180px;margin-bottom:20px}
.login-logo h2{font-size:18px;color:var(--ford-blue)}
.login-logo p{font-size:12px;color:var(--text-sec)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--text-sec)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:var(--font);background:var(--bg-input);color:var(--text)}
.form-group textarea{resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:8px 16px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all 0.15s}
.btn-primary{background:var(--ford-blue);color:#fff}
.btn-ford{background:var(--ford-orange);color:#fff}
.btn-secondary{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.stat-label{font-size:10px;color:var(--text-mut);text-transform:uppercase;font-weight:600;letter-spacing:0.5px}
.stat-value{font-size:24px;font-weight:700;margin-top:2px}
.alert-banner{padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:12px;font-size:12px;font-weight:600;border:1px solid var(--danger);background:var(--danger-bg);color:var(--danger)}
.ticket-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ticket-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all 0.15s;border-left:4px solid transparent}
.ticket-card:hover{box-shadow:0 2px 12px rgba(0,0,0,0.08);transform:translateY(-1px)}
.ticket-card.p-critical{border-left-color:var(--danger)}.ticket-card.p-high{border-left-color:var(--warning)}.ticket-card.p-medium{border-left-color:var(--info)}.ticket-card.p-low{border-left-color:var(--success)}
.ticket-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ticket-id{font-size:11px;font-weight:600;color:var(--text-mut);font-family:var(--mono)}
.ticket-date{font-size:11px;color:var(--text-mut)}
.ticket-title{font-size:14px;font-weight:600;margin-bottom:4px}
.ticket-desc{font-size:12px;color:var(--text-sec);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ticket-meta{display:flex;flex-wrap:wrap;gap:4px}
.tag{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;display:inline-block}
.tag-open{background:var(--info-bg);color:var(--info)}.tag-progress{background:var(--warning-bg);color:var(--warning)}.tag-resolved{background:var(--success-bg);color:var(--success)}.tag-closed{background:var(--bg);color:var(--text-mut)}
.tag-critical{background:var(--danger-bg);color:var(--danger)}.tag-high{background:var(--warning-bg);color:var(--warning)}.tag-medium{background:var(--info-bg);color:var(--info)}.tag-low{background:var(--success-bg);color:var(--success)}
.tag-cat{background:#FFF3E0;color:#E65100}.tag-mob{background:var(--success-bg);color:var(--success)}.tag-immob{background:var(--danger-bg);color:var(--danger)}.tag-media{background:var(--bg);color:var(--text-sec)}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filter-select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;background:var(--bg-input);color:var(--text);font-family:var(--font)}
.filter-search{flex:1;min-width:150px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;background:var(--bg-input);color:var(--text);font-family:var(--font)}
.detail-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:300;display:none}
.detail-overlay.active{display:block}
.detail-panel{position:fixed;top:0;right:-500px;width:480px;max-width:90vw;height:100vh;background:var(--bg-card);z-index:301;transition:right 0.3s;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,0.15)}
.detail-panel.active{right:0}
.detail-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.detail-hdr h3{font-size:16px}
.detail-body{flex:1;overflow-y:auto;padding:16px}
.detail-section{margin-bottom:16px}
.detail-section-title{font-size:12px;font-weight:700;color:var(--ford-orange);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.detail-field label{font-size:10px;color:var(--text-mut);display:block;margin-bottom:2px}
.detail-field span{font-size:13px;font-weight:500}
.detail-desc{font-size:13px;line-height:1.6;color:var(--text-sec);background:var(--bg);padding:10px;border-radius:var(--radius-sm)}
.detail-footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.activity-list{max-height:300px;overflow-y:auto}
.activity-item{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.activity-avatar{width:28px;height:28px;border-radius:50%;background:var(--ford-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.activity-content{flex:1;font-size:12px}
.activity-author{font-weight:600;margin-right:6px}
.activity-time{font-size:10px;color:var(--text-mut)}
.activity-text{margin-top:3px;color:var(--text-sec)}
.activity-change{margin-top:3px;color:var(--ford-blue);font-style:italic}
.comment-input{display:flex;gap:6px;margin-top:10px}
.comment-input input{flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;background:var(--bg-input);color:var(--text);font-family:var(--font)}
.close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-sec);padding:4px}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:400;display:none;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:var(--bg-card);border-radius:var(--radius);width:90%;max-width:500px;max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.2)}
.modal-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-hdr h3{font-size:15px}
.modal-body{padding:16px}
.modal-footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.file-drop{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;cursor:pointer;font-size:12px;color:var(--text-mut)}
.file-drop.dragover{border-color:var(--ford-orange);background:var(--bg)}
.file-previews{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.file-preview{width:60px;height:60px;border-radius:var(--radius-sm);overflow:hidden;position:relative;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--text-sec);cursor:pointer;background:var(--bg)}
.file-preview img{width:100%;height:100%;object-fit:cover}
.file-preview .rm{position:absolute;top:2px;right:2px;width:16px;height:16px;background:var(--danger);color:#fff;border:none;border-radius:50%;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.settings-table{width:100%;border-collapse:collapse;font-size:12px}
.settings-table th{text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;color:var(--ford-blue);border-bottom:2px solid var(--border)}
.settings-table td{padding:7px 10px;border-bottom:1px solid var(--border)}
.empty-state{text-align:center;padding:40px;color:var(--text-mut)}
.lightbox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:500;display:none;align-items:center;justify-content:center;cursor:pointer}
.lightbox.active{display:flex}
.lightbox img{max-width:90%;max-height:90%;border-radius:8px}

.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);z-index:90;padding:4px 0;padding-bottom:env(safe-area-inset-bottom)}
.mobile-nav-inner{display:flex;justify-content:space-around}
.mnav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;background:none;border:none;font-size:9px;color:var(--text-mut);cursor:pointer;font-family:var(--font)}
.mnav-btn svg{width:20px;height:20px}
.mnav-btn.active{color:var(--ford-blue)}
.hint{font-size:10px;color:var(--text-mut);margin-top:2px}
@media(max-width:768px){
  .tab-nav{display:none}
  .mobile-nav{display:block}
  .detail-panel{width:100%;max-width:100%}
  .form-row{grid-template-columns:1fr}
  .ticket-grid{grid-template-columns:1fr}
  .topbar-username{display:none}
  .login-logo img{height:100px !important}
  .analytics-sidebar{display:none !important}
  .analytics-content{min-width:0 !important}
  .analytics-flex{flex-direction:column !important}
  .analytics-grid-2{grid-template-columns:1fr !important}
  .mobile-dealer-filter{display:block !important}
  .stats-row{grid-template-columns:repeat(2,1fr) !important}
  .settings-table{font-size:10px}
  .settings-table th,.settings-table td{padding:5px 6px}
  .stat-card{padding:8px}
  .stat-value{font-size:20px}
  .stat-label{font-size:9px}
}
@media screen and (orientation:landscape) and (max-height:500px){
  body::after{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:var(--ford-blue);z-index:9999;display:flex;align-items:center;justify-content:center}
  body::before{content:'\uD83D\uDCF1 Bitte Hochformat verwenden / Please use portrait mode';position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:18px;font-family:var(--font);z-index:10000;text-align:center;white-space:nowrap}
}
</style>
</head>

function fmtDate(i){if(!i)return'\u2014';return new Date(i).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'})}
function fmtDT(i){if(!i)return'\u2014';const d=new Date(i);return d.toLocaleDateString('de-DE',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})}
function timeAgo(i){const d=Date.now()-new Date(i).getTime();const m=Math.floor(d/60000);if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';const days=Math.floor(h/24);if(days<7)return days+'d';return new Date(i).toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'})}
function getVisible(){if(!currentUser)return[];return currentUser.type==='ftd'?tickets:tickets.filter(t=>t.dealerName===currentUser.dealerName)}
function isFtd(){return currentUser&&currentUser.type==='ftd'}
function onHoliday(fid){const n=new Date();return holidays.some(h=>h.fid===fid&&new Date(h.from)<=n&&new Date(h.to)>=n)}
function getAssignee(dn,cat){
  const dl=DEALERS.find(d=>d.name===dn);if(!dl)return HEAD_OF_AS;
  let p='';
  if(cat==='Technisches Ticket')p=dl.tech;
  else if(cat==='Ersatzteil Ticket')p=dl.parts;
  else p=dl.claim;
  if(!p)return HEAD_OF_AS;
  // Match first name from dealer data to full name in FTD_TEAM
  const pl=p.toLowerCase();
  const m=FTD_TEAM.find(x=>x.name.toLowerCase()===pl||x.name.toLowerCase().startsWith(pl+' ')||x.name.split(' ')[0].toLowerCase()===pl);
  if(!m)return HEAD_OF_AS;
  if(onHoliday(m.id))return HEAD_OF_AS;
  return m.id;
}
function getFtdName(id){const m=FTD_TEAM.find(x=>x.id===id);return m?m.name:'\u2014'}
function clickTNo(tno){const t=tickets.find(x=>x.ticketNo===tno);if(t)openDetail(t.id)}
function linkTNo(tno){return '<span style="color:var(--ford-blue);cursor:pointer;text-decoration:underline;font-family:var(--mono);font-size:11px" onclick="clickTNo(\''+tno+'\')">'+tno+'</span>'}
function addLog(id,who,what){const t=tickets.find(x=>x.id===id);if(t){t.auditLog=t.auditLog||[];t.auditLog.push({who,when:new Date().toISOString(),what});t.updated=new Date().toISOString()}}
function addNotif(forUser,msg,ticketId){notifications.push({id:Date.now(),forUser,msg,ticketId,read:false,time:new Date().toISOString()})}
function toggleTheme(){const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t)}

}

  </div><div id="tList"></div>`;
  filterList();
}
function filterList(){
  let f=getVisible();const q=(document.getElementById('fSearch')?.value||'').toLowerCase();
  const cat=document.getElementById('fCat')?.value;const pri=document.getElementById('fPri')?.value;
  if(currentTab==='open')f=f.filter(t=>t.status==='Open');
  else if(currentTab==='in-progress')f=f.filter(t=>t.status==='In Progress');
  else if(currentTab==='resolved')f=f.filter(t=>t.status==='Resolved'||t.status==='Closed');
  if(q)f=f.filter(t=>t.title.toLowerCase().includes(q)||t.description.toLowerCase().includes(q)||t.ticketNo.toLowerCase().includes(q)||t.dealerName.toLowerCase().includes(q));
  if(cat)f=f.filter(t=>t.category===cat);if(pri)f=f.filter(t=>t.priority===pri);
  f.sort((a,b)=>new Date(b.updated)-new Date(a.updated));
  document.getElementById('tList').innerHTML=f.length?'<div class="ticket-grid">'+f.map(t=>tCard(t)).join('')+'</div>':'<div class="empty-state"><h3>'+L('Keine Tickets','No tickets')+'</h3></div>';
}

function tCard(t){
  const sMap={'Open':'tag-open','In Progress':'tag-progress','Resolved':'tag-resolved','Closed':'tag-closed'};
  const sIcon={'Open':'\u25CB','In Progress':'\u25D4','Resolved':'\u2705','Closed':'\uD83D\uDD12'};
  const pMap={'Critical':'tag-critical','High':'tag-high','Medium':'tag-medium','Low':'tag-low'};
  return `<div class="ticket-card p-${t.priority.toLowerCase()}" onclick="openDetail(${t.id})">
    <div class="ticket-header"><span class="ticket-id">${t.ticketNo}</span><span class="ticket-date">${timeAgo(t.updated)}</span></div>
    <div class="ticket-title">${t.title}</div>
    <div style="font-size:11px;color:var(--ford-orange);font-weight:600;margin-bottom:4px">\uD83C\uDFE2 ${t.dealerName}${t.dealerCity?' \u2014 '+t.dealerCity:''}</div>
    <div class="ticket-desc">${t.description}</div>
    <div class="ticket-meta"><span class="tag ${sMap[t.status]||''}">${sIcon[t.status]||''} ${t.status}</span><span class="tag ${pMap[t.priority]||''}">${t.priority}</span><span class="tag tag-cat">${t.category.split(' ')[0]}</span><span class="tag ${t.mobilized?'tag-mob':'tag-immob'}">${t.mobilized?'Mob':'Immob'}</span>${(t.media||[]).length?`<span class="tag tag-media">\uD83D\uDCCE${t.media.length}</span>`:''}</div></div>`;
}

          <div class="detail-field"><label>${L('Fahrzeug','Vehicle')}</label><span class="tag ${t.mobilized?'tag-mob':'tag-immob'}">${t.mobilized?L('Mobilisiert','Mobilized'):L('Immobilisiert','Immobilized')}</span></div>
          ${t.vin?`<div class="detail-field"><label>VIN</label><span style="font-family:var(--mono);font-size:11px">${t.vin}</span></div>`:''}
          ${t.rsaJobNo?`<div class="detail-field"><label>${L('Pannenfall Nr.','RSA Job No.')}</label><span style="font-family:var(--mono);font-size:11px">${t.rsaJobNo}</span></div>`:''}
          ${t.engineHours?`<div class="detail-field"><label>${L('Motorstunden','Engine Hours')}</label><span>${t.engineHours} h</span></div>`:''}

        </div></div>
      ${t.extra&&t.extra.probDate?`<div class="detail-section"><div class="detail-section-title">${L('Technische Details','Technical Details')}</div>

      ${t.extra&&(t.extra.newFirst||t.extra.delUsername||t.extra.accUsername)?`<div class="detail-section"><div class="detail-section-title">${L('Benutzer Details','User Details')}</div>
        <div class="detail-grid">
          ${t.extra.newFirst?`<div class="detail-field"><label>${L('Vorname','First Name')}</label><span>${t.extra.newFirst}</span></div>`:''}

        </div></div>`:''}
      <div class="detail-section"><div class="detail-section-title">${L('Beschreibung','Description')}</div><div class="detail-desc">${t.description}</div></div>

      ${(t.media&&t.media.length)?`<div class="detail-section"><div class="detail-section-title">${L('Anh\u00E4nge','Attachments')} (${t.media.length})</div><div class="file-previews">${t.media.map((m,i)=>m.type?.startsWith('video')?`<div class="file-preview" onclick="openLB2(${id},${i})">\u25B6MP4</div>`:m.type==='application/pdf'?`<div class="file-preview">PDF</div>`:`<div class="file-preview" onclick="openLB2(${id},${i})"><img src="${m.data}"></div>`).join('')}</div></div>`:''}

        <div class="comment-input"><input type="text" id="cInput" placeholder="${L('Kommentar','Comment')}..." onkeydown="if(event.key==='Enter')addComment(${id})"><button class="btn btn-primary btn-sm" onclick="addComment(${id})">${L('Senden','Send')}</button></div></div>

      <div style="width:100%;margin-bottom:6px;padding:6px 10px;background:var(--bg);border-radius:var(--radius-sm);font-size:10px;color:var(--text-mut)">${STATUS_FLOW}</div>

      <div style="font-size:10px;color:var(--text-mut);width:100%;margin-bottom:4px">\u2139\uFE0F ${STATUS_HINTS[t.status]}</div>

      ${t.status==='Resolved'&&!t.closingDesc?`<button class="btn btn-success btn-sm" onclick="showCloseModal(${id})">\uD83D\uDD12 ${L('Archivieren','Archive & Close')}</button>`:''}
      ${ce&&t.status==='Closed'&&currentUser.isAdmin?`<button class="btn btn-ford btn-sm" onclick="reopen(${id})">${L('Wieder\u00F6ffnen','Reopen')}</button>`:''}
      ${ce?`<button class="btn btn-secondary btn-sm" onclick="reassign(${id})">${L('Zuweisen','Assign')}</button>`:''}
    </div>`;
  document.getElementById('dOverlay').classList.add('active');document.getElementById('dPanel').classList.add('active');
}

function closeDetail(){document.getElementById('dOverlay').classList.remove('active');document.getElementById('dPanel').classList.remove('active')}

function showTranslate(id){
  const t=tickets.find(x=>x.id===id);if(!t)return;
  const deWords=['der','die','das','und','bei','ist','nicht','ein','mit','von','f\u00FCr','auf','wird','wurde','zum','zur','dem','den','des','nach','sich','aus','auch','wie','noch','werden','hat','ich','wir','sie','sind','kann','diese','einem','einer','haben','nur','oder','aber','vor','schon','wenn','mehr','keine','durch','bereits'];
  const words=(t.title+' '+t.description).toLowerCase().split(/\s+/);
  const deScore=words.filter(w=>deWords.includes(w)).length;
  const hasUmlauts=/[\u00E4\u00F6\u00FC\u00DF\u00C4\u00D6\u00DC]/.test(t.title+t.description);
  const isDE=deScore>=3||hasUmlauts;
  
  // Mock translation dictionary EN→DE
  const mockTrans={
    'Exhaust system overheating during long haul':'Abgasanlage \u00FCberhitzt bei Langstreckenfahrten',
    'Exhaust temperature sensors showing critical values above 650°C on highway routes. Started 3 days ago.':'Abgastemperatursensoren zeigen kritische Werte \u00FCber 650\u00B0C auf Autobahnstrecken. Seit 3 Tagen.',
    'Brake pad replacement needed — 2 axles':'Bremsbelagwechsel erforderlich \u2014 2 Achsen',
    'Front and rear axle brake pads below minimum thickness. Fleet vehicle, urgent turnaround needed.':'Vorder- und Hinterachse Bremsbel\u00E4ge unter Mindestst\u00E4rke. Flottenfahrzeug, dringender Wechsel erforderlich.',
    'Dashboard warning lights intermittent':'Armaturenbrett-Warnleuchten sporadisch',
    'Multiple warning lights appearing randomly on dashboard. No consistent pattern. Electrical issue suspected.':'Mehrere Warnleuchten erscheinen zuf\u00E4llig am Armaturenbrett. Kein einheitliches Muster. Elektrisches Problem vermutet.',
    'Spare part request: Air compressor seal kit':'Ersatzteil-Anfrage: Luftkompressor-Dichtungssatz',
    'Need seal kit for air compressor unit. Vehicle showing low air pressure warnings frequently.':'Dichtungssatz f\u00FCr Luftkompressoreinheit ben\u00F6tigt. Fahrzeug zeigt h\u00E4ufig Niederdruckwarnungen.',
    'New user account request':'Neuer Benutzer-Zugang angefordert',
    'New workshop technician needs access to Partnerportal and Warranty system for daily operations.':'Neuer Werkstatttechniker ben\u00F6tigt Zugang zu Partnerportal und Warranty-System f\u00FCr den t\u00E4glichen Betrieb.',
    'Coolant leak from radiator connection':'K\u00FChlmittelverlust an Radiatoranschluss',
    'Slow coolant leak detected at radiator hose connection. Temporary fix applied but needs proper repair.':'Langsamer K\u00FChlmittelverlust am K\u00FChlerschlauchanschluss festgestellt. Tempor\u00E4re Reparatur durchgef\u00FChrt, dauerhafte Reparatur erforderlich.'
  };
  
  if(isDE){
    document.getElementById('mOverlay').innerHTML=`<div class="modal"><div class="modal-hdr"><h3>\uD83C\uDF10 Translation</h3><button class="close-btn" onclick="closeModal()">\u2715</button></div>
      <div class="modal-body">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
          <span style="background:#0F2B46;color:#fff;font-size:11px;padding:3px 10px;border-radius:4px;font-weight:700">DeepL</span>
          <span style="font-size:12px;color:var(--success);font-weight:600">\u2705 ${L('Originaltext ist bereits auf Deutsch','Original text is already in German')}</span>
        </div>
        <div style="font-size:12px;color:var(--text-sec);padding:12px;background:var(--bg);border-radius:var(--radius-sm)">
          ${L('Eine \u00DCbersetzung ist nicht erforderlich, da der Originaltext bereits in deutscher Sprache verfasst ist.','No translation needed \u2014 the original text is already written in German.')}
        </div>
      </div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">OK</button></div></div>`;
  } else {
    const translatedTitle=mockTrans[t.title]||'[DE] '+t.title;
    const translatedDesc=mockTrans[t.description]||'[DE] '+t.description;
    document.getElementById('mOverlay').innerHTML=`<div class="modal"><div class="modal-hdr"><h3>\uD83C\uDF10 Translation EN \u2192 DE</h3><button class="close-btn" onclick="closeModal()">\u2715</button></div>
      <div class="modal-body">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
          <span style="background:#0F2B46;color:#fff;font-size:11px;padding:3px 10px;border-radius:4px;font-weight:700">DeepL</span>
          <span style="font-size:12px;color:var(--ford-orange);font-weight:600">PoC Demo \u2014 Mock Translation</span>
        </div>
        <div style="font-size:11px;color:var(--text-mut);margin-bottom:14px;padding:8px;background:var(--bg);border-radius:var(--radius-sm);border:1px dashed var(--border)">
          \u2139\uFE0F In production, this will use F-Trucks Deutschland's DeepL API subscription for real-time translation.
        </div>
        <div class="form-group"><label style="font-size:11px;color:var(--text-mut)">Original (EN)</label><div style="padding:8px 12px;background:var(--bg);border-radius:var(--radius-sm);font-size:13px;border:1px solid var(--border)">${t.title}</div></div>

        <div class="form-group"><label style="font-size:11px;color:var(--ford-orange)">\u00DCbersetzung / Translation (DE) <span style="background:#0F2B46;color:#fff;font-size:9px;padding:1px 5px;border-radius:3px">DeepL</span></label><div style="padding:8px 12px;background:var(--bg);border-radius:var(--radius-sm);font-size:12px;border:1px solid var(--ford-orange)">${translatedDesc}</div></div>
      </div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div></div>`;
  }
  document.getElementById('mOverlay').classList.add('active');
}

function addComment(id){const inp=document.getElementById('cInput');const txt=inp.value.trim();if(!txt)return;const t=tickets.find(x=>x.id===id);if(!t)return;t.comments=t.comments||[];t.comments.push({author:currentUser.name,text:txt,time:new Date().toISOString()});addLog(id,currentUser.name,'Kommentar');addNotif(t.assignedTo,t.ticketNo+': Kommentar von '+currentUser.name,id);saveState();openDetail(id);renderApp()}
function chgStatus(id){const t=tickets.find(x=>x.id===id);if(!t)return;const ns=document.getElementById('stChange').value;if(ns===t.status)return;
  if(ns==='Closed'){showCloseModal(id);return}
  const os=t.status;t.status=ns;addLog(id,currentUser.name,'Status: '+os+' \u2192 '+ns);addNotif(t.assignedTo,t.ticketNo+' Status: '+ns,id);saveState();openDetail(id);renderApp()}
function showCloseModal(id){
  const t=tickets.find(x=>x.id===id);if(!t)return;
  document.getElementById('mOverlay').innerHTML=`<div class="modal"><div class="modal-hdr"><h3>${L('Ticket schlie\u00DFen','Close Ticket')} \u2014 ${t.ticketNo}</h3><button class="close-btn" onclick="closeModal()">\u2715</button></div>
    <div class="modal-body">
      <div class="form-group"><label>${L('Abschlussbeschreibung','Closing Description')} *</label><textarea id="closeDesc" rows="4" placeholder="${L('Was wurde gemacht?','What was done?')}"></textarea></div>
      <div class="form-group"><label>${L('Grund','Reason')} *</label><select id="closeReason" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text);font-size:13px;font-family:var(--font)">${CLOSE_REASONS.map(r=>`<option value="${r}">${r}</option>`).join('')}</select></div>
    </div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">${L('Abbrechen','Cancel')}</button><button class="btn btn-primary" onclick="doCloseTicket(${id})">${L('Schlie\u00DFen','Close')}</button></div></div>`;
  document.getElementById('mOverlay').classList.add('active');
}
function doCloseTicket(id){const desc=document.getElementById('closeDesc').value.trim();const reason=document.getElementById('closeReason').value;if(!desc)return;const t=tickets.find(x=>x.id===id);if(!t)return;t.status='Closed';t.closingDesc=desc;t.closeReason=reason;addLog(id,currentUser.name,'Closed: '+reason);saveState();closeModal();openDetail(id);renderApp()}
function reopen(id){const t=tickets.find(x=>x.id===id);if(!t)return;t.status='Open';t.closingDesc='';addLog(id,currentUser.name,'Reopened');saveState();openDetail(id);renderApp()}
function reassign(id){const t=tickets.find(x=>x.id===id);if(!t)return;
  document.getElementById('mOverlay').innerHTML=`<div class="modal"><div class="modal-hdr"><h3>${L('Zuweisen','Assign')} \u2014 ${t.ticketNo}</h3><button class="close-btn" onclick="closeModal()">\u2715</button></div>
    <div class="modal-body"><div class="form-group"><label>${L('Neu zuweisen an','Assign to')}</label><select id="reassignTo" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-input);color:var(--text);font-size:13px;font-family:var(--font)">${FTD_TEAM.map(m=>`<option value="${m.id}" ${m.id===t.assignedTo?'selected':''}>${m.name} \u2014 ${m.role}${onHoliday(m.id)?' \uD83C\uDFD6\uFE0F':''}</option>`).join('')}</select></div></div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">${L('Abbrechen','Cancel')}</button><button class="btn btn-primary" onclick="doReassign(${id})">${L('Zuweisen','Assign')}</button></div></div>`;
  document.getElementById('mOverlay').classList.add('active');
}
function doReassign(id){const t=tickets.find(x=>x.id===id);if(!t)return;const nid=document.getElementById('reassignTo').value;const m=FTD_TEAM.find(x=>x.id===nid);if(!m||nid===t.assignedTo){closeModal();return}const old=t.assignedTo;t.assignedTo=nid;addLog(id,currentUser.name,'Assigned: '+getFtdName(old)+' \u2192 '+m.name);addNotif(nid,t.ticketNo+' assigned',id);saveState();closeModal();openDetail(id);renderApp()}

function editTicket(id){
  if(!isFtd())return;const t=tickets.find(x=>x.id===id);if(!t)return;
  document.getElementById('mOverlay').innerHTML=`<div class="modal"><div class="modal-hdr"><h3>${L('Bearbeiten','Edit')} \u2014 ${t.ticketNo}</h3><button class="close-btn" onclick="closeModal()">\u2715</button></div>
    <div class="modal-body">
      <div class="form-group"><label>${L('Titel','Title')}</label><input type="text" id="eTitle" value="${t.title}"></div>
      <div class="form-group"><label>${L('Beschreibung','Description')}</label><textarea id="eDesc" rows="3">${t.description}</textarea></div>

function saveEdit(id){const t=tickets.find(x=>x.id===id);if(!t)return;

  if(nC!==t.category){addLog(id,currentUser.name,'Category: '+t.category+' \u2192 '+nC);t.category=nC}

}

    if(sub==='Benutzer Anlegen'){

function syncAlleCheck(){const singles=document.querySelectorAll('.fSysSingle');const alle=document.getElementById('fSysAlle');if(!alle)return;const allChecked=[...singles].every(c=>c.checked);alle.checked=allChecked}
function setupFU(){const dz=document.getElementById('dropZ');const fi=document.getElementById('fInput');if(!dz||!fi)return;dz.onclick=()=>fi.click();dz.ondragover=e=>{e.preventDefault();dz.classList.add('dragover')};dz.ondragleave=()=>dz.classList.remove('dragover');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('dragover');handleF(e.dataTransfer.files)};fi.onchange=()=>handleF(fi.files)}
function handleF(fl){const ok=['image/jpeg','application/pdf','video/mp4'];Array.from(fl).forEach(f=>{if(!ok.includes(f.type))return;const r=new FileReader();r.onload=e=>{uploadedFiles.push({name:f.name,type:f.type,data:e.target.result});renderFP()};r.readAsDataURL(f)})}
function renderFP(){const c=document.getElementById('fPrevs');if(!c)return;c.innerHTML=uploadedFiles.map((f,i)=>{if(f.type==='application/pdf')return`<div class="file-preview">PDF<button class="rm" onclick="rmF(${i})">\u2715</button></div>`;if(f.type?.startsWith('video'))return`<div class="file-preview">\u25B6MP4<button class="rm" onclick="rmF(${i})">\u2715</button></div>`;return`<div class="file-preview"><img src="${f.data}"><button class="rm" onclick="rmF(${i})">\u2715</button></div>`}).join('')}
function rmF(i){uploadedFiles.splice(i,1);renderFP()}

function saveNew(){
  const title=document.getElementById('fTitle').value.trim();const desc=document.getElementById('fDesc').value.trim();
  if(!title||!desc){alert(L('Titel und Beschreibung erforderlich','Title and description required'));return}
  const cat=document.getElementById('fCat2').value;const sub=document.getElementById('fSub').value;
  const pri=document.getElementById('fPri2').value;const mob=document.getElementById('fMob').value==='true';
  const vin=document.getElementById('fVin')?.value.trim()||'';
  const rsa=document.getElementById('fRsa')?.value.trim()||'';
  const eh=document.getElementById('fEngHrs')?.value.trim()||'';
  const ml=document.getElementById('fMileage')?.value.trim()||'';
  
  // Extra fields object
  const extra={};
  
  // Technisches Ticket validation
  if(cat==='Technisches Ticket'){
    if(!vin){alert(L('VIN ist Pflichtangabe','VIN is required'));return}
    if(!eh){alert(L('Motorstunden ist Pflichtangabe','Engine hours is required'));return}
    if(!ml){alert(L('Kilometerstand ist Pflichtangabe','Mileage is required'));return}
    extra.probDate=document.getElementById('fProbDate')?.value||'';
    extra.stepsChecked=document.getElementById('fStepsChecked')?.value.trim()||'';
    if(!extra.probDate){alert(L('Datum Problem erstmalig aufgetreten ist Pflichtangabe','Date problem first occurred is required'));return}
    if(!extra.stepsChecked){alert(L('Schritte bis jetzt gepr\u00FCft ist Pflichtangabe','Steps checked so far is required'));return}
  }
  
  // Ersatzteil Ticket validation
  if(cat==='Ersatzteil Ticket'){
    if(sub==='Ersatzteil Ermittlung'&&!vin){alert(L('VIN ist Pflichtangabe f\u00FCr Ersatzteil Ermittlung','VIN is required for part identification'));return}
    if(sub==='Ersatzteil Ersetzung'){
      extra.partNo=document.getElementById('fPartNo')?.value.trim()||'';
      if(!extra.partNo){alert(L('Ersatzteilnummer ist Pflichtangabe','Part number is required'));return}
    }
  }
  
  // Sonstiges Ticket validation
  if(cat==='Sonstiges Ticket'){
    if(sub==='Benutzer Anlegen'){
      extra.newFirst=document.getElementById('fNewFirst')?.value.trim()||'';
      extra.newLast=document.getElementById('fNewLast')?.value.trim()||'';
      extra.newEmail=document.getElementById('fNewEmail')?.value.trim()||'';
      extra.newFunc=document.getElementById('fNewFunc')?.value.trim()||'';
      extra.systems=[...document.querySelectorAll('.fSys:checked')].map(c=>c.value).filter(v=>v!=='Alle');
      if(!extra.newFirst||!extra.newLast||!extra.newEmail||!extra.newFunc){alert(L('Vorname, Nachname, E-Mail und Funktion sind Pflichtangaben','First name, last name, email and function are required'));return}
      if(!extra.systems.length){alert(L('Bitte mindestens ein System ausw\u00E4hlen','Please select at least one system'));return}
    }
    if(sub==='Benutzer L\u00F6schen'){
      extra.delUsername=document.getElementById('fDelUser')?.value.trim()||'';
      extra.systems=[...document.querySelectorAll('.fSys:checked')].map(c=>c.value).filter(v=>v!=='Alle');
      if(!extra.delUsername){alert(L('Benutzername ist Pflichtangabe','Username is required'));return}
    }
    if(sub==='Benutzer Zugangsprobleme / Passwort'){
      extra.accUsername=document.getElementById('fAccUser')?.value.trim()||'';
      if(!extra.accUsername){alert(L('Benutzername ist Pflichtangabe','Username is required'));return}
    }
  }
  
  let dn,dc,at;
  if(currentUser.type==='dealer'){dn=currentUser.dealerName;dc=currentUser.dealerCity;at=getAssignee(dn,cat)}
  else{const di=parseInt(document.getElementById('fDealer').value);const d=DEALERS[di];dn=d.name;dc=d.city;at=document.getElementById('fAssign').value}
  const t={id:nextTid++,ticketNo:'FTD-'+String(nextTid-1).padStart(4,'0'),title,description:desc,category:cat,subcat:sub,priority:pri,status:'Open',dealerName:dn,dealerCity:dc,assignedTo:at,mobilized:mob,vin,rsaJobNo:rsa,engineHours:eh,mileage:ml,extra,media:[...uploadedFiles],comments:[],auditLog:[{who:currentUser.name,when:new Date().toISOString(),what:'Ticket created'}],created:new Date().toISOString(),updated:new Date().toISOString(),closingDesc:'',closeReason:''};
  tickets.unshift(t);addNotif(at,'New: '+t.ticketNo+' from '+dn,t.id);saveState();closeModal();renderApp();
}

function setAnalyticsDealer(v){analyticsDealer=v;renderContent()}
function renderAnalytics(mc){
  if(!isFtd()){mc.innerHTML='<div class="empty-state"><h3>'+L('Kein Zugriff','No access')+'</h3></div>';return}
  
  // Build dealer list with ticket counts for sidebar
  const allTickets=tickets;
  const dealerTicketCounts={};
  allTickets.forEach(t=>{dealerTicketCounts[t.dealerName]=(dealerTicketCounts[t.dealerName]||0)+1});
  const activeDealerNames=[...new Set(allTickets.map(t=>t.dealerName))].sort();
  
  // Filter by selected dealer
  const all=analyticsDealer?allTickets.filter(t=>t.dealerName===analyticsDealer):allTickets;
  const filterLabel=analyticsDealer||L('Alle Dealer','All Dealers');
  const open=all.filter(t=>t.status==='Open');
  const prog=all.filter(t=>t.status==='In Progress');
  const res=all.filter(t=>t.status==='Resolved');
  const closed=all.filter(t=>t.status==='Closed');
  const active=[...open,...prog];
  const immob=active.filter(t=>!t.mobilized);
  const crit=active.filter(t=>t.priority==='Critical');
  const now=Date.now();

  const dealerCounts={};
  all.forEach(t=>{dealerCounts[t.dealerName]=(dealerCounts[t.dealerName]||0)+1});
  const topDealers=Object.entries(dealerCounts).sort((a,b)=>b[1]-a[1]).slice(0,10);

  const catCounts={};
  CATEGORIES.forEach(c=>{catCounts[c]=all.filter(t=>t.category===c).length});

  const priCounts={};
  PRIORITIES.forEach(p=>{priCounts[p]=active.filter(t=>t.priority===p).length});

  const assignCounts={};
  active.forEach(t=>{const n=getFtdName(t.assignedTo);assignCounts[n]=(assignCounts[n]||0)+1});
  const assignList=Object.entries(assignCounts).sort((a,b)=>b[1]-a[1]);

  const resolvedAll=[...res,...closed].filter(t=>t.created&&t.updated);
  let avgResTime='\u2014';
  if(resolvedAll.length){const totalDays=resolvedAll.reduce((sum,t)=>sum+(new Date(t.updated)-new Date(t.created))/86400000,0);avgResTime=(totalDays/resolvedAll.length).toFixed(1)}

  const resRate=all.length?((res.length+closed.length)/all.length*100).toFixed(0):'0';

  const subCounts={};
  active.forEach(t=>{if(t.subcat)subCounts[t.subcat]=(subCounts[t.subcat]||0)+1});
  const topSubs=Object.entries(subCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);

  const immobByDealer={};
  immob.forEach(t=>{immobByDealer[t.dealerName]=(immobByDealer[t.dealerName]||0)+1});
  const immobList=Object.entries(immobByDealer).sort((a,b)=>b[1]-a[1]);

  // Aging Analysis
  const ageBuckets={'0-2d':0,'3-5d':0,'6-10d':0,'10d+':0};
  active.forEach(t=>{const days=(now-new Date(t.created).getTime())/86400000;if(days<=2)ageBuckets['0-2d']++;else if(days<=5)ageBuckets['3-5d']++;else if(days<=10)ageBuckets['6-10d']++;else ageBuckets['10d+']++});
  const ageColors={'0-2d':'success','3-5d':'info','6-10d':'warning','10d+':'danger'};

  // Abschlussgründe / Closing Reasons
  const closeReasons={};
  [...res,...closed].forEach(t=>{if(t.closeReason){closeReasons[t.closeReason]=(closeReasons[t.closeReason]||0)+1}});
  const closeReasonList=Object.entries(closeReasons).sort((a,b)=>b[1]-a[1]);

  // Response Time per Staff
  const staffResponse={};
  all.forEach(t=>{if(!t.assignedTo||!t.created)return;const name=getFtdName(t.assignedTo);const firstAction=(t.comments||[]).find(c=>c.author!=='System');const firstLog=(t.auditLog||[]).find((a,i)=>i>0&&a.who!=='System');let rt=null;if(firstAction)rt=(new Date(firstAction.time)-new Date(t.created))/3600000;else if(firstLog)rt=(new Date(firstLog.when)-new Date(t.created))/3600000;if(rt!==null&&rt>=0){if(!staffResponse[name])staffResponse[name]={total:0,count:0};staffResponse[name].total+=rt;staffResponse[name].count++}});
  const staffResponseList=Object.entries(staffResponse).map(([name,d])=>[name,(d.total/d.count).toFixed(1)]).sort((a,b)=>a[1]-b[1]);

  // Repeat Offenders
  const dealerSubcatMap={};
  all.forEach(t=>{const key=t.dealerName+'|||'+t.subcat;dealerSubcatMap[key]=(dealerSubcatMap[key]||0)+1});
  const repeaters=Object.entries(dealerSubcatMap).filter(([k,v])=>v>=2).map(([k,v])=>{const[d,s]=k.split('|||');return{dealer:d,subcat:s,count:v}}).sort((a,b)=>b.count-a.count).slice(0,10);

  // Ersatzteil Pipeline
  const etSubs=['Ersatzteil Ermittlung','Ersatzteil Reklamation','Ersatzteil R\u00fccksendung','Ersatzteil Ersetzung','Sonstiges'];
  const etPipeline={};etSubs.forEach(s=>{etPipeline[s]={open:0,prog:0,resolved:0}});
  all.filter(t=>t.category==='Ersatzteil Ticket').forEach(t=>{const s=t.subcat||'Sonstiges';if(!etPipeline[s])etPipeline[s]={open:0,prog:0,resolved:0};if(t.status==='Open')etPipeline[s].open++;else if(t.status==='In Progress')etPipeline[s].prog++;else etPipeline[s].resolved++});

  // VIN Fleet View
  const vinMap={};
  all.forEach(t=>{if(t.vin&&t.vin.length>5){if(!vinMap[t.vin])vinMap[t.vin]={count:0,tickets:[],dealer:t.dealerName};vinMap[t.vin].count++;vinMap[t.vin].tickets.push(t.ticketNo)}});
  const multiVin=Object.entries(vinMap).filter(([v,d])=>d.count>=2).sort((a,b)=>b[1].count-a[1].count);

  // Ticket Creation Trend (14 days)
  const trend={};
  for(let i=13;i>=0;i--){const d=new Date(now-i*86400000);const key=d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});trend[key]=0}
  all.forEach(t=>{const d=new Date(t.created);const key=d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});if(trend[key]!==undefined)trend[key]++});
  const trendEntries=Object.entries(trend);const trendMax=Math.max(...trendEntries.map(x=>x[1]),1);

  // Dealers with Zero Activity
  const activeDealers=new Set(all.map(t=>t.dealerName));
  const zeroDealers=DEALERS.filter(d=>!activeDealers.has(d.name));

  function bar(val,max,color){const pct=max?Math.round(val/max*100):0;return`<div style="background:var(--border);border-radius:3px;height:18px;flex:1;overflow:hidden"><div style="background:var(--${color});height:100%;width:${pct}%;border-radius:3px;transition:width 0.3s"></div></div>`}
  function card(title,content){return`<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px"><strong style="font-size:13px;display:block;margin-bottom:10px">${title}</strong>${content}</div>`}

  mc.innerHTML=`
  <div class="analytics-flex" style="display:flex;gap:14px;align-items:flex-start">
    <!-- LEFT SIDEBAR -->
    <div class="analytics-sidebar" style="width:220px;flex-shrink:0;position:sticky;top:66px">
      <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">
        <div style="padding:10px 12px;background:var(--ford-blue);color:#fff;font-size:12px;font-weight:700">\uD83C\uDFE2 ${L('Dealer Filter','Dealer Filter')}</div>
        <div style="max-height:calc(100vh - 160px);overflow-y:auto">
          <div onclick="setAnalyticsDealer('')" style="padding:8px 12px;font-size:11px;cursor:pointer;border-bottom:1px solid var(--border);font-weight:${!analyticsDealer?'700':'400'};color:${!analyticsDealer?'var(--ford-orange)':'var(--text)'};background:${!analyticsDealer?'var(--bg)':'transparent'}">\u25C9 ${L('Alle Dealer','All Dealers')} <span style="float:right;color:var(--text-mut);font-size:10px">${allTickets.length}</span></div>
          ${activeDealerNames.map(dn=>{const cnt=dealerTicketCounts[dn]||0;const sel=analyticsDealer===dn;return`<div onclick="setAnalyticsDealer('${dn.replace(/'/g,"\\\\'")}')" style="padding:7px 12px;font-size:10px;cursor:pointer;border-bottom:1px solid var(--border);font-weight:${sel?'700':'400'};color:${sel?'var(--ford-orange)':'var(--text)'};background:${sel?'var(--bg)':'transparent'}" onmouseover="this.style.background='var(--bg)'" onmouseout="this.style.background='${sel?'var(--bg)':'transparent'}'"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${sel?'var(--ford-orange)':'var(--border)'};margin-right:6px"></span>${dn.length>28?dn.substring(0,28)+'...':dn} <span style="float:right;color:var(--text-mut);font-size:9px">${cnt}</span></div>`}).join('')}
        </div>
      </div>
    </div>
    <!-- RIGHT CONTENT -->
    <div class="analytics-content" style="flex:1;min-width:0">
    ${analyticsDealer?`<div style="margin-bottom:12px;padding:10px 14px;background:var(--ford-blue);color:#fff;border-radius:var(--radius);display:flex;justify-content:space-between;align-items:center"><div><strong style="font-size:14px">\uD83C\uDFE2 ${analyticsDealer}</strong><br><span style="font-size:11px;opacity:0.8">${all.length} ${L('Tickets','tickets')} | ${L('Gefilterte Ansicht','Filtered view')}</span></div><button onclick="setAnalyticsDealer('')" style="background:rgba(255,255,255,0.15);border:none;color:#fff;padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:11px;font-family:var(--font)">\u2715 ${L('Filter entfernen','Clear filter')}</button></div>`:''}
    <div class="mobile-dealer-filter" style="display:none;margin-bottom:12px">
      <select onchange="setAnalyticsDealer(this.value)" style="width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--bg-input);color:var(--text);font-family:var(--font)">
        <option value="" ${!analyticsDealer?'selected':''}>\uD83C\uDFE2 ${L('Alle Dealer','All Dealers')} (${allTickets.length})</option>
        ${activeDealerNames.map(dn=>`<option value="${dn.replace(/'/g,"&#39;")}" ${analyticsDealer===dn?'selected':''}>${dn} (${dealerTicketCounts[dn]||0})</option>`).join('')}
      </select>
    </div>
    <div class="stats-row" style="grid-template-columns:repeat(auto-fit,minmax(100px,1fr))">
      <div class="stat-card"><div class="stat-label">Gesamt / Total</div><div class="stat-value">${all.length}</div></div>
      <div class="stat-card"><div class="stat-label">Offen / Open</div><div class="stat-value" style="color:var(--info)">${open.length}</div></div>
      <div class="stat-card"><div class="stat-label">In Bearbeitung</div><div class="stat-value" style="color:var(--warning)">${prog.length}</div></div>
      <div class="stat-card"><div class="stat-label">Erledigt / Resolved</div><div class="stat-value" style="color:var(--success)">${res.length+closed.length}</div></div>
      <div class="stat-card"><div class="stat-label">Kritisch / Critical</div><div class="stat-value" style="color:var(--danger)">${crit.length}</div></div>
      <div class="stat-card"><div class="stat-label">Immobilisiert</div><div class="stat-value" style="color:var(--danger)">${immob.length}</div></div>
      <div class="stat-card"><div class="stat-label">\u00D8 Resolution (days)</div><div class="stat-value">${avgResTime}</div></div>
      <div class="stat-card"><div class="stat-label">Lösungsrate / Resolution Rate</div><div class="stat-value" style="color:var(--success)">${resRate}%</div></div>
    </div>

    <div class="analytics-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      ${card('Tickets nach Kategorie / Tickets by Category', CATEGORIES.map(c=>{const cnt=catCounts[c]||0;const mx=Math.max(...Object.values(catCounts));return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:11px;width:120px;flex-shrink:0;color:var(--text-sec)">${c.split(' ')[0]}</span>${bar(cnt,mx,'ford-orange')}<strong style="font-size:12px;width:30px;text-align:right">${cnt}</strong></div>`}).join(''))}
      ${card('Aktive nach Priorität / Active by Priority', PRIORITIES.map(p=>{const cnt=priCounts[p]||0;const mx=Math.max(...Object.values(priCounts),1);const col=p==='Critical'?'danger':p==='High'?'warning':p==='Medium'?'info':'success';return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:11px;width:60px;flex-shrink:0;color:var(--text-sec)">${p}</span>${bar(cnt,mx,col)}<strong style="font-size:12px;width:30px;text-align:right">${cnt}</strong></div>`}).join(''))}
    </div>

    <div class="analytics-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      ${card('\u23F1 Ticket-Alter (Offene Tickets) / Ticket Aging', Object.entries(ageBuckets).map(([label,cnt])=>{const mx=Math.max(...Object.values(ageBuckets),1);const col=ageColors[label];return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:11px;width:50px;flex-shrink:0;color:var(--text-sec)">${label}</span>${bar(cnt,mx,col)}<strong style="font-size:12px;width:30px;text-align:right;color:var(--${col})">${cnt}</strong></div>`}).join('')+(ageBuckets['10d+']?'<div style="margin-top:8px;font-size:11px;color:var(--danger);font-weight:600">\u26A0 '+ageBuckets['10d+']+' Tickets offen seit über 10 Tagen</div>':''))}
      ${card('\u2705 Abschlussgründe / Closing Reasons', closeReasonList.length?closeReasonList.map(([r,cnt])=>{const mx=closeReasonList[0][1];return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:10px;width:140px;flex-shrink:0;color:var(--text-sec)">${r.split(' / ')[0]}</span>${bar(cnt,mx,'success')}<strong style="font-size:12px;width:30px;text-align:right">${cnt}</strong></div>`}).join(''):'<div style="color:var(--text-mut);font-size:12px">Keine geschlossenen Tickets mit Gründen</div>')}
    </div>

    <div class="analytics-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      ${card('\uD83D\uDC64 Mitarbeiter-Auslastung / Staff Workload', assignList.length?assignList.map(([name,cnt])=>{const mx=Math.max(...assignList.map(x=>x[1]),1);return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:11px;width:80px;flex-shrink:0;color:var(--text-sec)">${name}</span>${bar(cnt,mx,'info')}<strong style="font-size:12px;width:30px;text-align:right">${cnt}</strong></div>`}).join(''):'<div style="color:var(--text-mut);font-size:12px">Keine aktiven Tickets</div>')}
      ${card('\u23F1 Ø Reaktionszeit / Avg Response Time (h)', staffResponseList.length?staffResponseList.map(([name,hrs])=>{const mx=Math.max(...staffResponseList.map(x=>parseFloat(x[1])),1);const col=parseFloat(hrs)<=4?'success':parseFloat(hrs)<=12?'warning':'danger';return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:11px;width:80px;flex-shrink:0;color:var(--text-sec)">${name}</span>${bar(parseFloat(hrs),mx,col)}<strong style="font-size:12px;width:40px;text-align:right;color:var(--${col})">${hrs}h</strong></div>`}).join(''):'<div style="color:var(--text-mut);font-size:12px">Keine Reaktionszeitdaten vorhanden</div>')}
    </div>

    <div class="analytics-grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
      ${card('\uD83D\uDD27 Häufigste Probleme / Top Issue Types', topSubs.length?topSubs.map(([name,cnt])=>{const mx=topSubs[0][1];return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:11px;width:120px;flex-shrink:0;color:var(--text-sec)">${name}</span>${bar(cnt,mx,'warning')}<strong style="font-size:12px;width:30px;text-align:right">${cnt}</strong></div>`}).join(''):'<div style="color:var(--text-mut);font-size:12px">Keine Daten</div>')}
      ${card('\uD83D\uDD01 Wiederkehrende Probleme / Repeat Issues', repeaters.length?`<table class="settings-table"><thead><tr><th style="font-size:10px">Dealer</th><th style="font-size:10px">Issue Type</th><th style="font-size:10px">#</th></tr></thead><tbody>${repeaters.map(r=>`<tr><td style="font-size:10px">${r.dealer.substring(0,28)}</td><td style="font-size:10px"><span class="tag tag-cat" style="font-size:9px;padding:2px 6px">${r.subcat}</span></td><td><strong style="color:var(--danger)">${r.count}x</strong></td></tr>`).join('')}</tbody></table>`:'<div style="color:var(--text-mut);font-size:12px">Keine Muster erkannt</div>')}
    </div>

    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px">
      <strong style="font-size:13px;display:block;margin-bottom:10px">\uD83D\uDCC8 Ticket-Volumen-Trend / Volume Trend (14 Tage)</strong>
      <div style="display:flex;align-items:flex-end;gap:4px;height:160px;padding-top:8px">
        ${trendEntries.map(([date,cnt])=>{const h=trendMax?Math.round(cnt/trendMax*120):0;return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px"><span style="font-size:9px;color:var(--text-sec)">${cnt||''}</span><div style="width:100%;height:${h}px;background:var(--ford-orange);border-radius:3px 3px 0 0;min-height:${cnt?4:1}px;opacity:${cnt?1:0.2}"></div><span style="font-size:8px;color:var(--text-mut);writing-mode:vertical-lr;transform:rotate(180deg);height:35px">${date}</span></div>`}).join('')}
      </div>
    </div>

    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px">
      <strong style="font-size:13px;display:block;margin-bottom:10px">\uD83D\uDCE6 Ersatzteil Pipeline / Spare Parts Pipeline</strong>
      <table class="settings-table"><thead><tr><th>Stage</th><th>Open</th><th>In Progress</th><th>Resolved</th><th>Total</th></tr></thead><tbody>
      ${etSubs.map(s=>{const d=etPipeline[s]||{open:0,prog:0,resolved:0};const tot=d.open+d.prog+d.resolved;return tot?`<tr><td style="font-size:11px">${s}</td><td>${d.open?`<span class="tag tag-open">${d.open}</span>`:'\u2014'}</td><td>${d.prog?`<span class="tag tag-progress">${d.prog}</span>`:'\u2014'}</td><td>${d.resolved?`<span class="tag tag-resolved">${d.resolved}</span>`:'\u2014'}</td><td><strong>${tot}</strong></td></tr>`:''}).join('')}
      </tbody></table>
    </div>

    <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px">
      <strong style="font-size:13px;display:block;margin-bottom:10px">\uD83C\uDFC6 Dealer Scorecard \u2014 Top 10 nach Volumen</strong>
      <table class="settings-table"><thead><tr><th>Dealer</th><th>Tickets</th><th>Open</th><th>Critical</th><th>Immob.</th><th>Resolved</th><th>Rate</th></tr></thead><tbody>
      ${topDealers.map(([name,cnt])=>{const dt=all.filter(t=>t.dealerName===name);const dO=dt.filter(t=>t.status==='Open'||t.status==='In Progress').length;const dC=dt.filter(t=>t.priority==='Critical'&&t.status!=='Resolved'&&t.status!=='Closed').length;const dI=dt.filter(t=>!t.mobilized&&t.status!=='Resolved'&&t.status!=='Closed').length;const dR=dt.filter(t=>t.status==='Resolved'||t.status==='Closed').length;const rate=cnt?(dR/cnt*100).toFixed(0):'0';return`<tr><td style="font-size:10px">${name}</td><td><strong>${cnt}</strong></td><td>${dO?`<span class="tag tag-open">${dO}</span>`:'\u2014'}</td><td>${dC?`<span class="tag tag-critical">${dC}</span>`:'\u2014'}</td><td>${dI?`<span class="tag tag-immob">${dI}</span>`:'\u2014'}</td><td>${dR}</td><td><strong style="color:${parseInt(rate)>=70?'var(--success)':parseInt(rate)>=40?'var(--warning)':'var(--danger)'}">${rate}%</strong></td></tr>`}).join('')}
      </tbody></table>
    </div>

    ${multiVin.length?`<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px">
      <strong style="font-size:13px;display:block;margin-bottom:10px;color:var(--danger)">\uD83D\uDE9B Problemfahrzeuge / Problem Vehicles (mehrere Tickets pro VIN)</strong>
      <table class="settings-table"><thead><tr><th>VIN</th><th>Dealer</th><th>Tickets</th><th>Ticket Nos.</th></tr></thead><tbody>
      ${multiVin.map(([vin,d])=>`<tr><td style="font-size:10px;font-family:var(--mono)">${vin}</td><td style="font-size:10px">${d.dealer}</td><td><strong style="color:var(--danger)">${d.count}</strong></td><td style="font-size:10px">${d.tickets.map(tn=>linkTNo(tn)).join(', ')}</td></tr>`).join('')}
      </tbody></table>
    </div>`:``}

    ${immobList.length?`<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px">
      <strong style="font-size:13px;display:block;margin-bottom:10px;color:var(--danger)">\uD83D\uDE9B Immobilisierte Fahrzeuge nach Dealer / Immobilized Vehicles</strong>
      ${immobList.map(([name,cnt])=>{const mx=immobList[0][1];return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-size:11px;width:200px;flex-shrink:0;color:var(--text-sec)">${name}</span>${bar(cnt,mx,'danger')}<strong style="font-size:12px;width:30px;text-align:right;color:var(--danger)">${cnt}</strong></div>`}).join('')}
    </div>`:``}

    ${zeroDealers.length&&!analyticsDealer?`<div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px">
      <strong style="font-size:13px;display:block;margin-bottom:10px">\uD83D\uDCCB Inactive Dealers (${zeroDealers.length} of ${DEALERS.length} ohne Tickets / with zero tickets)</strong>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${zeroDealers.slice(0,30).map(d=>`<span class="tag" style="font-size:10px;padding:3px 8px;background:var(--bg);border:1px solid var(--border)">${d.name} <span style="color:var(--text-mut)">\u2014 ${d.city}</span></span>`).join('')}
        ${zeroDealers.length>30?`<span style="font-size:11px;color:var(--text-mut);padding:4px">... and ${zeroDealers.length-30} more</span>`:''}
      </div>
    </div>`:``}
    </div><!-- /RIGHT CONTENT -->
  </div><!-- /FLEX LAYOUT -->
  `;
}


// INIT
loadState();
renderApp();
</script>
</body>
</html>
